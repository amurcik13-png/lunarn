<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lunarn — мессенджер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lunarn">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#eef1fe;--tx:#151828;--mu:#686e8e;
  --gl:rgba(255,255,255,.58);--gb:rgba(255,255,255,.82);
  --th:rgba(255,255,255,.74);--inb:rgba(255,255,255,.84);
  --ac:#7c5cff;--ac2:#35c6ff;--sh:rgba(50,60,130,.15);--ln:rgba(115,122,168,.15);
  --fs:15px;--br:22px;--bl:24px;--wpdim:0;
  --aur:radial-gradient(46% 42% at 16% 16%,color-mix(in srgb,var(--ac) 44%,transparent),transparent),radial-gradient(42% 38% at 88% 28%,color-mix(in srgb,var(--ac2) 36%,transparent),transparent),radial-gradient(46% 42% at 54% 94%,rgba(255,107,181,.22),transparent);
  --wp:var(--aur);--wimg:none;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#070912;--tx:#f3f5ff;--mu:#9097bd;
    --gl:rgba(20,23,39,.58);--gb:rgba(255,255,255,.13);
    --th:rgba(255,255,255,.08);--inb:rgba(26,30,50,.76);
    --sh:rgba(0,0,0,.52);--ln:rgba(255,255,255,.075);
  }
}
:root[data-theme=dark]{
  --bg:#070912;--tx:#f3f5ff;--mu:#9097bd;
  --gl:rgba(20,23,39,.58);--gb:rgba(255,255,255,.13);
  --th:rgba(255,255,255,.08);--inb:rgba(26,30,50,.76);
  --sh:rgba(0,0,0,.52);--ln:rgba(255,255,255,.075);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit;border:0;background:none;outline:0;font-size:16px!important}
button{font:inherit;color:inherit;border:0;background:none;outline:0;cursor:pointer;transition:transform .24s cubic-bezier(.3,1.55,.5,1),background .2s,color .2s,opacity .2s}
button:active{transform:scale(.92)}
video{transform:none!important}
html{width:100%;height:100vh;min-height:100lvh;background:var(--bg);overflow:hidden}
body{position:fixed;inset:0;width:100%;height:100vh;min-height:100lvh;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;background:var(--bg);color:var(--tx);font:var(--fs)/1.38 'Onest',system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:-80px;background:var(--aur);z-index:-1;pointer-events:none;animation:dr 34s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(3%,4%) rotate(5deg)}}
[data-aur="0"] body::before{display:none}
.gl{background:var(--gl);-webkit-backdrop-filter:blur(var(--bl)) saturate(195%);backdrop-filter:blur(var(--bl)) saturate(195%);border:1px solid var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -8px 18px rgba(255,255,255,.03),0 10px 30px var(--sh)}

#app{position:fixed;inset:0;width:100%;height:100vh;min-height:100lvh;display:flex;overflow:hidden}
#side{width:100%;height:100%;position:relative;flex:none;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 96px;display:none}
.pg.on{display:block}
h1{font-size:29px;font-weight:700;letter-spacing:-.03em}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;gap:8px}
.top-acts{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--th)}

.net-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--th);color:var(--mu)}
.net-pill i{width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block}
.net-pill.off i{background:#ff4d6d;animation:bl 1s infinite}
.net-pill.loc i{background:#ffb020}

.sr{display:flex;gap:12px;overflow-x:auto;margin-bottom:12px;padding:2px 0;scrollbar-width:none}
.sr::-webkit-scrollbar{display:none}
.sr button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mu);flex:none;width:66px}
.rg{padding:2.5px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),#ff6bb5,var(--ac))}
.rg.sn{background:var(--ln)}
.rg>span{display:block;padding:2px;border-radius:50%;background:var(--bg)}

.srch{display:flex;align-items:center;gap:8px;padding:0 15px;height:44px;border-radius:22px;margin-bottom:10px;color:var(--mu)}
.srch input{flex:1;color:var(--tx);min-width:0}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:8px 15px;border-radius:18px;white-space:nowrap;color:var(--mu);font-size:14px}
.chips .on{background:var(--ac);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 46%,transparent)}

.sec-lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 10px 6px}
.card{border-radius:28px;overflow:hidden;margin-bottom:12px}
.row{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center;transition:transform .2s,background .2s;position:relative;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--ln)}
.row:hover,.row.act{background:var(--th)}
.row:active{transform:scale(.982)}
[data-comp="1"] .row{padding-top:7px;padding-bottom:7px}

.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;position:relative;box-shadow:inset 0 1px 2px rgba(255,255,255,.42),0 4px 12px rgba(0,0,0,.16);background-size:cover!important;background-position:center!important}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#34d399;border:2.5px solid var(--bg);z-index:2}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.r1 i{font-style:normal;font-size:12px;color:var(--mu);flex:none;display:inline-flex;align-items:center;gap:3px}
.r1 span{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 em{flex:none;font-style:normal;color:var(--mu);display:flex;align-items:center;gap:5px}
.r1 s{text-decoration:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--ac);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.r1 s.mu{background:var(--mu)}
.em0{text-align:center;color:var(--mu);padding:34px 18px;font-size:14px;line-height:1.5}
.role-tag{font-size:11px;padding:2px 7px;border-radius:8px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);font-weight:600;margin-left:5px;vertical-align:middle}
.mention{color:#7ee8ff;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mw:not(.me) .mention{color:var(--ac)}

#tb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;padding:6px;border-radius:32px;z-index:4}
#tb button{width:76px;height:54px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mu);position:relative;z-index:1}
#tb .on{color:var(--tx);font-weight:600}
#ind{position:absolute;top:6px;left:6px;width:76px;height:54px;border-radius:26px;background:var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.45);transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
#bd{position:absolute;top:4px;left:54px;min-width:18px;height:18px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;z-index:2}

#chat{position:absolute;inset:0;z-index:5;background:var(--wimg),var(--wp),var(--bg);background-size:cover,auto,auto;background-position:center;transform:translateX(102%);transition:transform .36s cubic-bezier(.2,.86,.2,1);overflow:hidden}
#chat::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--wpdim));pointer-events:none;z-index:0}
#chat.open{transform:none}
#emp{position:relative;z-index:1;height:100%;display:grid;place-content:center;text-align:center;color:var(--mu);gap:10px;padding:20px}
#emp div{font-size:56px}
#cv{position:absolute;inset:0;display:none;overflow:hidden;z-index:1}
#chat.has #cv{display:block}
#chat.has #emp{display:none}

#hd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:4;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:30px}
.hm{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;padding:2px 4px;border-radius:20px}
.hm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.hm small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.typ-tx{color:var(--ac2)!important;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.typ-dots{display:inline-flex;gap:2.5px;align-items:center}
.typ-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:tdot 1.2s infinite ease-in-out}
.typ-dots i:nth-child(2){animation-delay:.2s}
.typ-dots i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-3px);opacity:1}}

#pn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:14px;right:14px;z-index:3;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;font-size:13px;cursor:pointer;color:var(--ac)}
#pn span{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#unk-bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:14px;right:14px;z-index:3;display:none;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px 7px 14px;border-radius:18px;font-size:13px}
#cv.pinned #unk-bar{top:calc(env(safe-area-inset-top,0px) + 112px)}
#unk-bar span{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#unk-add{padding:6px 12px;border-radius:14px;background:var(--ac);color:#fff;font-size:12.5px;font-weight:600;flex:none}
#sq{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:14px;right:14px;z-index:4;display:none;align-items:center;gap:8px;border-radius:20px;padding:0 14px}
#sq input{flex:1;height:42px}

#ms{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 78px) 12px 76px}
#cv.pinned #ms,#cv.has-unk #ms{padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
#cv.pinned.has-unk #ms{padding-top:calc(env(safe-area-inset-top,0px) + 162px)}
.ds{text-align:center;margin:12px 0 8px}
.ds span{display:inline-block;padding:4px 13px;border-radius:14px;font-size:12px;color:var(--mu);font-weight:500}

.wave-card{margin:14vh auto 0;max-width:270px;padding:24px 18px;border-radius:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .35s}
.wave-em{font-size:84px;line-height:1;display:inline-block;animation:fy 2.8s ease-in-out infinite;cursor:pointer}
.wave-btn{padding:10px 18px;border-radius:20px;background:var(--ac);color:#fff;font-weight:600;font-size:14px;margin-top:4px}

.mw{position:relative;display:flex;flex-direction:column;align-items:flex-start;margin:5px 0;touch-action:pan-y;transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .26s ease,transform .28s cubic-bezier(.4,0,.2,1),margin .32s ease}
.mw.me{align-items:flex-end}
.mw.grp{margin-top:2px}
.mw.center{align-items:center;margin:12px 0}
.mw.del-out{opacity:0!important;transform:scale(.88) translateX(-18px);max-height:0!important;margin:0!important;overflow:hidden;pointer-events:none}
.mw.me.del-out{transform:scale(.88) translateX(18px)}
.sw-ic{position:absolute;right:8px;top:50%;transform:translateY(-50%) scale(.4);width:34px;height:34px;border-radius:50%;background:var(--gl);border:1px solid var(--gb);color:var(--ac);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.mw-inner{display:flex;flex-direction:column;align-items:inherit;max-width:100%;will-change:transform}
.mw.fh .b{box-shadow:0 0 0 3px var(--ac2),0 0 28px color-mix(in srgb,var(--ac2) 55%,transparent);transform:scale(1.025)}
.mw.holding .b{transform:scale(.96)}

.b{max-width:min(82vw,420px);padding:9px 13px 7px;border-radius:var(--br) var(--br) var(--br) 6px;background:var(--inb);border:1px solid var(--gb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 4px 16px rgba(0,0,0,.08);overflow-wrap:anywhere;transition:box-shadow .35s,transform .28s cubic-bezier(.3,1.5,.5,1)}
.b::after{content:"";display:table;clear:both}
.me .b{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 38%,var(--ac2)));color:#fff;border-color:rgba(255,255,255,.18);border-radius:var(--br) var(--br) 6px var(--br);box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 30%,transparent)}
[data-grad="0"] .me .b{background:var(--ac)}
.mw.nw .b,.mw.nw .gf-card{animation:pop .28s cubic-bezier(.3,1.35,.5,1)}
.mw.edanim .b{animation:edFlash .55s cubic-bezier(.22,1.2,.36,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@keyframes edFlash{0%{transform:scale(.95);box-shadow:0 0 0 0 var(--ac2)}50%{transform:scale(1.03);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac2) 60%,transparent)}100%{transform:scale(1)}}

.b.photo-b{padding:3px!important;border-radius:20px!important;overflow:hidden;position:relative}
.b.photo-b .im{display:block;max-width:min(74vw,300px);max-height:310px;border-radius:17px;cursor:pointer;object-fit:cover}
.b.photo-b .mt{position:absolute;right:9px;bottom:9px;margin:0;padding:2px 8px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;opacity:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.b.big{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;padding:2px!important;color:inherit}
.b.big .mt{background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:10px;opacity:1}

.mt{float:right;margin:5px 0 -1px 10px;font-size:11px;opacity:.78;display:inline-flex;align-items:center;gap:3px}
.ticks{display:inline-flex;align-items:center;width:16px;height:12px;vertical-align:middle}
.ticks svg{width:16px;height:12px;overflow:visible}
.ticks .ck1,.ticks .ck2{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ticks .ck2{opacity:0;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .4s ease,opacity .25s ease}
.ticks.rd{color:#7ee8ff}
.ticks.rd .ck2{opacity:1;stroke-dashoffset:0}
.ticks.anim .ck2{animation:tickDraw .45s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tickDraw{from{opacity:0;stroke-dashoffset:18}to{opacity:1;stroke-dashoffset:0}}
[data-ticks="0"] .ticks{display:none!important}
.clk{display:inline-flex;width:13px;height:13px;opacity:.85;animation:spinClk 2s linear infinite}
@keyframes spinClk{to{transform:rotate(360deg)}}

.fw{font-size:12px;color:var(--ac2);font-weight:600;margin-bottom:3px;cursor:pointer;display:inline-block}
.fw:hover{text-decoration:underline}
.me .fw{color:rgba(255,255,255,.92)}
.an{font-size:13px;font-weight:700;margin-bottom:2px;cursor:pointer;display:inline-block}
.an:hover{text-decoration:underline}
.rq{border-left:3px solid var(--ac2);padding:4px 9px;margin:2px 0 6px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.12);border-radius:4px 10px 10px 4px;transition:background .15s}
.rq:active{background:rgba(255,255,255,.22)}
.me .rq{border-left-color:#fff;background:rgba(255,255,255,.18)}
.rq b{display:block;font-size:12px}
.rx{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.rc{padding:3px 9px;border-radius:12px;font-size:13px;background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s}
.rc.my{background:var(--ac);color:#fff;border-color:transparent}
.rc.pop{animation:rxPop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes rxPop{0%{transform:scale(.4)}60%{transform:scale(1.28)}100%{transform:scale(1)}}

.gf-card{width:min(78vw,272px);padding:18px 16px 15px;border-radius:28px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.32),transparent 65%),linear-gradient(155deg,color-mix(in srgb,var(--ac) 86%,#1b1040),color-mix(in srgb,var(--ac2) 55%,#ff5ea8));color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 36px color-mix(in srgb,var(--ac) 40%,rgba(0,0,0,.35))}
.gf-card::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 280deg,rgba(255,255,255,.22) 320deg,transparent 360deg);animation:spinGlow 8s linear infinite;pointer-events:none}
@keyframes spinGlow{to{transform:rotate(360deg)}}
.gf-card>*{position:relative;z-index:1}
.gf-who{font-size:12px;opacity:.86;margin-bottom:4px;font-weight:500}
.gf-em{font-size:66px;line-height:1.1;margin:4px 0 6px;display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-6px) scale(1.05) rotate(3deg)}}
.gf-name{font-size:17px;font-weight:700;display:block}
.gf-txt{margin:8px 0 4px;padding:7px 10px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13.5px;line-height:1.35}
.gf-price{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:600;margin-top:6px}
.gf-btn{display:block;width:100%;margin-top:10px;padding:9px;border-radius:16px;background:rgba(255,255,255,.94);color:#171a2b;font-weight:700;font-size:13.5px}
.gf-ok{display:block;margin-top:8px;font-size:12px;opacity:.88}

#gf-anim{position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,7,18,.58);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:none}
#gf-anim.on{display:flex;animation:fadeIn .25s}
.gfa-em{font-size:112px;filter:drop-shadow(0 16px 36px rgba(124,92,255,.65));animation:gfaBounce 1.1s cubic-bezier(.2,1.5,.4,1)}
@keyframes gfaBounce{0%{transform:scale(.15) rotate(-18deg);opacity:0}45%{transform:scale(1.22) rotate(6deg);opacity:1}75%{transform:scale(.95) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.gfa-tx{font-size:20px;font-weight:700;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.5)}

.vc{display:flex;align-items:center;gap:10px;width:236px}
.vp{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.wv-wrap{position:relative;flex:1;height:30px;cursor:pointer;display:flex;align-items:center}
.wv-layer{display:flex;align-items:center;gap:2px;width:100%;height:100%}
.wv-layer i{flex:1;border-radius:2px;background:currentColor;min-height:4px;transition:height .12s ease}
.wv-bg{opacity:.35}
.wv-fg{position:absolute;inset:0;clip-path:inset(0 100% 0 0);transition:clip-path .06s linear;opacity:1}
.vc-tm{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85;min-width:30px;text-align:right}
.rec-wv{display:flex;align-items:center;gap:2.5px;flex:1;height:28px;overflow:hidden}
.rec-wv i{width:3px;border-radius:3px;background:linear-gradient(to top,var(--ac),var(--ac2));transition:height .09s cubic-bezier(.2,.9,.3,1);min-height:4px;flex:none}

const isContact=u=>Array.isArray(me.contacts)&&me.contacts.includes(cleanU(u));
const iBlocked=u=>Array.isArray(me.blocked)&&me.blocked.includes(cleanU(u));
const blockedMe=u=>{const x=USERS[cleanU(u)];return !!(x&&Array.isArray(x.blocked)&&x.blocked.includes(cleanU(me.u)))};
const isAnyBlocked=u=>iBlocked(u)||blockedMe(u);

const dispName=p=>{
  if(!p)return '';
  if(p.t==='u'&&cleanU(p.u)!==cleanU(me.u)&&!isContact(p.u))return 'Неизвестный';
  return p.n||fmtU(p.u);
};

function canSeeAvatar(p){
  if(!p||!p.av)return false;
  const k=cleanU(p.u);
  if(!k||k===cleanU(me.u)||p.t==='s'||p.t==='g'||p.t==='c')return true;
  if(isAnyBlocked(k))return false;
  const u=USERS[k]||p;
  const priv=u.photo_priv||'Все';
  if(priv==='Никто')return false;
  if(priv==='Контакты')return Array.isArray(u.contacts)&&u.contacts.includes(cleanU(me.u));
  return true;
}

function formatLastSeen(p){
  if(!p)return '';
  if(p.t==='s')return 'ваши заметки и облако';
  if(p.t==='g')return p.s||'Группа';
  if(p.t==='c')return p.s||'Канал';
  const k=cleanU(p.u);
  if(isAnyBlocked(k))return 'был(а) очень давно';
  const u=USERS[k]||p;
  const priv=u.lastseen_priv||'Все';
  const canExact=priv==='Все'||(priv==='Контакты'&&Array.isArray(u.contacts)&&u.contacts.includes(cleanU(me.u)));
  if(!canExact)return 'был(а) недавно';
  if(u.on)return 'в сети';
  const ts=u.ts||p.ts;
  if(!ts)return 'был(а) недавно';
  const diffDays=dd(ts);
  if(diffDays<1)return 'был(а) сегодня в '+tm(ts);
  if(diffDays===1)return 'был(а) вчера в '+tm(ts);
  return 'был(а) '+new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'short'})+' в '+tm(ts);
}

  saveAll();publishMyProfile(true);
  if(cur&&cleanU(cur.u)===k){$('#hn').textContent=dispName(cur);$('#ha').innerHTML=av(cur,40);updateUnknownBar()}

}

function toggleBlockUser(u){
  const k=cleanU(u);if(!k||k===cleanU(me.u))return;

function urlB64ToUint8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function reqSysNotif(silent){
  if(!('Notification' in window)){if(!silent)toast('Браузер не поддерживает уведомления ОС');return}
  try{
    const res=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(res!=='granted'){if(!silent)toast('Доступ к уведомлениям отклонён');return}
    if(ST.vapidPub&&'serviceWorker' in navigator&&'PushManager' in window){
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(ST.vapidPub.trim())});
      if(sub&&sb&&cleanU(me.u)){
        await sb.from('users').update({push_sub:sub.toJSON()}).eq('username',cleanU(me.u));
      }
    }
    if(!silent)toast('Уведомления ОС включены 🔔');
  }catch(e){if(!silent)toast('Уведомления ОС включены 🔔')}
}

function sysNotify(title,body,tag){
  if(!ST.n||!('Notification' in window)||Notification.permission!=='granted')return;
  if(!document.hidden&&document.hasFocus())return;
  const opts={body:body||'Новое событие',icon:'icon.svg',badge:'icon.svg',vibrate:[180,80,180],tag:tag||'lunarn-ev',renotify:true};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,opts)).catch(()=>{try{new Notification(title,opts)}catch(e){}});
  }else{try{new Notification(title,opts)}catch(e){}}
}

async function uploadMediaBlob(blob,ext){
  if(!sb||!navigator.onLine)return null;
  try{
    const path=`${cleanU(me.u)||'user'}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
    const {error}=await sb.storage.from('media').upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:true});
    if(error)return null;
    const {data}=sb.storage.from('media').getPublicUrl(path);
    return data&&data.publicUrl?data.publicUrl:null;
  }catch(e){return null}
}

async function loadCloudState(){
  if(!sb)return;
  const [uRes,sRes]=await Promise.all([
    sb.from('users').select('username,n,u,ph,b,h,av,is_online,updated_at,contacts,blocked,photo_priv,lastseen_priv'),
    sb.from('stories').select('*')
  ]);
  if(uRes.data){
    uRes.data.forEach(syncUserRow);
    if(tabs===0)list();if(tabs===1)cons();
  }
  if(sRes.data){
    STORIES={};
    sRes.data.forEach(r=>{if(r.data)STORIES[r.username]=r.data});
    strs();if(tabs===3)mset();
  }
  saveAll();
  await pullPendingInbox();
}

async function pullPendingInbox(){
  const myKey=cleanU(me.u);
  if(!sb||!myKey)return;
  const {data}=await sb.from('inbox').select('*').eq('target_u',myKey).order('id',{ascending:true});
  if(data&&data.length){
    for(const row of data){
      handleIncomingEvent(row.payload);
      sb.from('inbox').delete().eq('id',row.id).then(()=>{});
    }
  }
}

async function publishMyProfile(online=true){
  const myKey=cleanU(me.u);if(!myKey)return;
  const row={
    username:myKey,n:me.n,u:fmtU(myKey),ph:me.ph||'',b:me.b||'',h:me.h||255,av:me.av||'',
    is_online:!!online,updated_at:Date.now(),
    contacts:Array.isArray(me.contacts)?me.contacts:[],
    blocked:Array.isArray(me.blocked)?me.blocked:[],
    photo_priv:ST.photo||'Все',
    lastseen_priv:ST.lastseen||'Все'
  };
  if(me.pw)row.password=me.pw;
  syncUserRow(row);saveAll();
  if(sb&&navigator.onLine)await sb.from('users').upsert(row,{onConflict:'username'});
}

function subscribeMyChats(){
  if(!sb)return;
  sbChannels.forEach(ch=>sb.removeChannel(ch));sbChannels=[];
  const myKey=cleanU(me.u);

  const chGlobal=sb.channel('lunarn_global_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},payload=>{
      if(payload.new)syncUserRow(payload.new);
      if(tabs===0)list();if(tabs===1)cons();strs();saveAll();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'stories'},payload=>{
      if(payload.eventType==='DELETE'&&payload.old){delete STORIES[payload.old.username]}
      else if(payload.new){STORIES[payload.new.username]=payload.new.data}
      strs();if(tabs===3)mset();saveAll();
    })
    .on('broadcast',{event:'typing'},({payload})=>{if(payload)handleTypingEvent(payload)})
    .on('broadcast',{event:'live_ev'},({payload})=>{if(payload)handleIncomingEvent(payload)})
    .subscribe(status=>{
      dbOnline=(status==='SUBSCRIBED');
      updateNetUI();
      if(dbOnline){publishMyProfile(true);flushOutbox();pullPendingInbox();if('Notification' in window&&Notification.permission==='granted')reqSysNotif(true)}
    });
  rtLive=chGlobal;
  sbChannels.push(chGlobal);

  if(myKey){
    const chInbox=sb.channel('lunarn_inbox_'+myKey)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'inbox',filter:`target_u=eq.${myKey}`},payload=>{
        const row=payload.new;if(!row)return;
        handleIncomingEvent(row.payload);
        sb.from('inbox').delete().eq('id',row.id).then(()=>{});
      })
      .subscribe();
    sbChannels.push(chInbox);
  }
}

function resumeCloud(){
  if(!cleanU(me.u)||!sb)return;
  publishMyProfile(true);
  pullPendingInbox();
  if(!dbOnline&&navigator.onLine)subscribeMyChats();
}
document.addEventListener('visibilitychange',()=>{

    if(document.hidden)publishMyProfile(false);
    else resumeCloud();
  }
});
window.addEventListener('focus',resumeCloud);
window.addEventListener('pageshow',resumeCloud);
window.addEventListener('beforeunload',()=>{if(cleanU(me.u)&&sb)publishMyProfile(false)});

async function pushEventToTarget(targetU,ev){
  const key=cleanU(targetU);if(!key)return;
  ev.evId=ev.evId||('ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
  const fullEv=Object.assign({targetKey:key},ev);
  try{if(bc)bc.postMessage(fullEv)}catch(e){}
  let live=false;
  if(rtLive&&dbOnline){
    try{const r=await rtLive.send({type:'broadcast',event:'live_ev',payload:fullEv});live=(r==='ok')}catch(e){}
  }
  if(sb&&navigator.onLine&&!(ev.type==='webrtc'&&live)){
    const {error}=await sb.from('inbox').insert({target_u:key,payload:fullEv});
    if(error)throw error;
  }
}

function sendTypingState(isTyp){
  if(!cur||cur.t!=='u'||isAnyBlocked(cur.u))return;
  const now=Date.now();
  if(isTyp&&now-lastTypSent<1800)return;
  lastTypSent=isTyp?now:0;
  const payload={type:'typing',targetKey:cleanU(cur.u),fromU:cleanU(me.u),isTyp:!!isTyp};
  try{if(bc)bc.postMessage(payload)}catch(e){}
  if(rtLive&&dbOnline)rtLive.send({type:'broadcast',event:'typing',payload}).catch(()=>{});
}

function handleTypingEvent(ev){
  if(!ev||ev.targetKey!==cleanU(me.u))return;
  const from=cleanU(ev.fromU);
  if(isAnyBlocked(from))return;
  const p=P.find(x=>x.t==='u'&&cleanU(x.u)===from);
  if(!p)return;
  clearTimeout(typTimers[from]);
  p.typing=!!ev.isTyp;
  if(p.typing)typTimers[from]=setTimeout(()=>{p.typing=false;updateChatStatus(p);list()},3400);
  updateChatStatus(p);list();
}

function updateChatStatus(p){
  if(cur!==p)return;
  const hs=$('#hs');if(!hs)return;
  if(p.typing)hs.innerHTML=TYP_HTML;
  else hs.textContent=formatLastSeen(p);
}

  $('#gfa-tx').textContent=txt||'Новый подарок!';
  el.classList.add('on');burst();

}

function handleIncomingEvent(ev){
  if(!ev)return;
  if(ev.evId){if(seenEv.has(ev.evId))return;seenEv.add(ev.evId);if(seenEv.size>400)seenEv.clear()}
  const myKey=cleanU(me.u);
  if(ev.targetKey&&ev.targetKey!==myKey)return;
  if(ev.fromU&&iBlocked(ev.fromU)&&ev.type!=='webrtc')return;

  if(ev.type==='msg'){
    let p=P.find(x=>x.id===ev.chatId||(ev.fromU&&cleanU(x.u)===cleanU(ev.fromU)&&x.t==='u'));
    if(!p){
      const known=USERS[cleanU(ev.fromU)]||{};
      p={id:ev.chatId||chatRoomId(myKey,ev.fromU),n:ev.sender.n,u:fmtU(ev.sender.u),h:ev.sender.h||240,av:ev.sender.av||'',contacts:known.contacts||[],blocked:known.blocked||[],photo_priv:known.photo_priv||'Все',lastseen_priv:known.lastseen_priv||'Все',t:ev.chatType||'u',role:'member',on:1,ts:Date.now(),m:[]};
      P.unshift(p);
    }
    p.typing=false;updateChatStatus(p);
    if(!p.m.some(x=>x.id===ev.msg.id)){
      const incoming=Object.assign({},ev.msg,{me:0,nw:1,pending:0});
      p.m.push(incoming);
      const label=dispName(p),preview=ST.prev?pv(incoming):'Новое сообщение';
      if(cur===p){
        drawMsgs(1);
        if(ST.ro)pushEventToTarget(ev.fromU,{type:'read',chatId:p.id,fromU:me.u}).catch(()=>{});
      }else{
        p.un=(p.un|0)+1;
        if(!p.mute&&ST.n)toast(`${label}: ${preview}`);
      }
      if(!p.mute)sysNotify(label,preview,'msg-'+p.id);
      if(incoming.k==='gift'){playGiftAnim(incoming.g,`${incoming.anon?'Аноним':label} подарил(а) ${incoming.gn}`);if(tabs===3)mset()}
      fx();list();saveAll();
    }
  }else if(ev.type==='react'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    const m=p&&p.m.find(x=>x.id===ev.msgId);
    if(m){
      m.rx=m.rx||{};
      const r=m.rx[ev.emoji]||(m.rx[ev.emoji]=[0,0]);
      r[0]=Math.max(0,r[0]+(ev.add?1:-1));
      if(!r[0])delete m.rx[ev.emoji];
      m._rxPop=ev.emoji;
      if(cur===p)drawMsgs();
      saveAll();
    }
  }else if(ev.type==='vote'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    const m=p&&p.m.find(x=>x.id===ev.msgId);
    if(m&&m.o&&m.o[ev.opt]!=null){
      m.o[ev.opt][1]=(m.o[ev.opt][1]|0)+1;
      if(cur===p)drawMsgs();
      saveAll();
    }
  }else if(ev.type==='read'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    if(p){p.m.forEach(m=>{if(m.me&&!m.rd){m.rd=1;m._rdAnim=1}});if(cur===p)drawMsgs();list();saveAll()}
  }else if(ev.type==='del'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    if(p){
      const el=cur===p?$(`#ms [data-id="${ev.msgId}"]`):null;
      const done=()=>{p.m=p.m.filter(x=>x.id!==ev.msgId);if(cur===p){pin();drawMsgs()}list();saveAll()};
      if(el)smoothDelEl(el,done);else done();
    }

  const links=msgs.filter(m=>m.t&&/https?:\/\/\S+/.test(m.t));
  if(!tab)tab=pubs.length?'pubs':(gifts.length?'gifts':(media.length?'media':'pubs'));

  let body='';
  if(tab==='gifts'){
    body=gifts.length?`<div class="pgrid3">${gifts.map((m,idx)=>`<button class="pgift" data-gfidx="${idx}"><span>${m.g}</span><b>${esc(m.gn)}</b><small>🌙 ${m.gp}</small></button>`).join('')}</div>`:'<p class="em0" style="padding:22px">Подарков пока нет</p>';
  }else if(tab==='media'){
    body=media.length?`<div class="pgrid3">${media.map(m=>`<div class="pmed" data-openimg="${m.src}">${m.k==='vnote'?`<img src="${m.poster||''}"><span class="pmed-tag">⭕ ${m.d||1}с</span>`:`<img src="${m.src}">`}</div>`).join('')}</div>`:'<p class="em0" style="padding:22px">Медиафайлов нет</p>';
  }else if(tab==='voice'){
    body=voices.length?voices.map(m=>`<div class="inf"><b>🎤 Голосовое · ${m.d||1} сек</b><small>${dl(m.ts)} в ${tm(m.ts)}</small></div>`).join(''):'<p class="em0" style="padding:22px">Голосовых сообщений нет</p>';
  }else if(tab==='links'){
    body=links.length?links.map(m=>`<div class="inf"><span>${linkMentions(m.t)}</span><small>${dl(m.ts)}</small></div>`).join(''):'<p class="em0" style="padding:22px">Ссылок пока нет</p>';
  }else{
    const addCard=isSelf?`<button class="pmed" id="add-pub-btn" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--gb);color:var(--ac);font-weight:600;font-size:12px">${I('plus',24)}<span>Добавить</span></button>`:'';
    const itemsHtml=pubs.map((st,idx)=>`<div class="pmed" data-pubidx="${idx}">${st.type==='vid'?`<video src="${st.src}" muted playsinline></video><span class="pmed-tag">▶ Видео</span>`:`<img src="${st.src}">`}</div>`).join('');
    body=(pubs.length||isSelf)?`<div class="pgrid3">${addCard}${itemsHtml}</div>`:'<p class="em0" style="padding:22px">Публикаций пока нет</p>';
  }

  targetEl.innerHTML=`
    <div class="ptabs">
      <button data-pt="pubs" class="${tab==='pubs'?'on':''}">Публикации${pubs.length?' ('+pubs.length+')':''}</button>
      <button data-pt="gifts" class="${tab==='gifts'?'on':''}">Подарки${gifts.length?' ('+gifts.length+')':''}</button>
      <button data-pt="media" class="${tab==='media'?'on':''}">Медиа${media.length?' ('+media.length+')':''}</button>
      <button data-pt="voice" class="${tab==='voice'?'on':''}">Голосовые</button>
      <button data-pt="links" class="${tab==='links'?'on':''}">Ссылки</button>
    </div>${body}`;

  targetEl.onclick=e=>{
    const tb=e.target.closest('[data-pt]');if(tb){renderProfShowcase(targetEl,msgs,uKey,isSelf,tb.dataset.pt);return}
    const gf=e.target.closest('[data-gfidx]');if(gf){const m=gifts[+gf.dataset.gfidx];if(m)openGiftModal(m,isSelf?null:m.a);return}
    if(e.target.closest('#add-pub-btn')){pickNewStory();return}
    const pb=e.target.closest('[data-pubidx]');if(pb){openStory(uKey,+pb.dataset.pubidx);return}
    const oi=e.target.closest('[data-openimg]');if(oi&&oi.dataset.openimg){openLightbox(oi.dataset.openimg);return}
  };
}

function storageSize(){
  let t=0;try{for(let k in localStorage)if(localStorage.hasOwnProperty(k))t+=(localStorage[k].length+k.length)*2}catch(e){}
  return t>1048576?(t/1048576).toFixed(2)+' МБ':Math.max(1,Math.round(t/1024))+' КБ';
}

let mediaRec=null,mediaStream=null,recChunks=[],recPeaks=[],audioCtx=null,analyser=null,wvRaf=null,recStartTs=0;

async function startAudioRec(){
  rs=0;recChunks=[];recPeaks=[];recStartTs=Date.now();
  $('#rc').classList.add('on');$('#rt').textContent='0:00,0';$('#rec-wv').innerHTML='';
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).catch(()=>navigator.mediaDevices.getUserMedia({audio:true}));
    mediaRec=new MediaRecorder(mediaStream);
    mediaRec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    mediaRec.start(150);
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(mediaStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=128;analyser.smoothingTimeConstant=0.72;src.connect(analyser);
    const buf=new Uint8Array(analyser.frequencyBinCount);

    const sample=(now)=>{
      if(!audioCtx)return;
      analyser.getByteFrequencyData(buf);
      let sum=0;for(let i=0;i<16;i++)sum+=buf[i];
      const h=Math.max(4,Math.min(26,Math.round(4+(sum/16/255)*30)));
      if(now-lastBar>65){
        lastBar=now;recPeaks.push(h);
        const bar=document.createElement('i');bar.style.height=h+'px';
        const wv=$('#rec-wv');wv.append(bar);if(wv.children.length>38)wv.firstChild.remove();
      }

      $('#rt').textContent=`${Math.floor(rs/60)}:${String(rs%60).padStart(2,'0')},${Math.floor((ms%1000)/100)}`;
      wvRaf=requestAnimationFrame(sample);
    };
    wvRaf=requestAnimationFrame(sample);
  }catch(e){toast('Разрешите доступ к микрофону');$('#rc').classList.remove('on')}
}

function stopAudioRec(doSend){
  cancelAnimationFrame(wvRaf);$('#rc').classList.remove('on');
  if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}
  const dur=Math.max(rs,1),peaks=[],n=28,len=recPeaks.length||1;
  for(let i=0;i<n;i++)peaks.push(recPeaks[Math.min(len-1,Math.floor(i*len/n))]||8);
  if(mediaRec&&mediaRec.state!=='inactive'){
    mediaRec.onstop=async()=>{
      if(doSend&&recChunks.length){
        const mime=(mediaRec.mimeType||'audio/mp4').split(';')[0],ext=mime.includes('webm')?'webm':'m4a';
        const blob=new Blob(recChunks,{type:mime}),url=await uploadMediaBlob(blob,ext);
        if(url)add({k:'voice',d:dur,src:url,peaks});
        else{const r=new FileReader();r.onload=()=>add({k:'voice',d:dur,src:r.result,peaks});r.readAsDataURL(blob)}

}

    const cvsStream=cvs.captureStream?cvs.captureStream(60):vrCamStream;
    const outStream=new MediaStream([...cvsStream.getVideoTracks(),...vrAudioStream.getAudioTracks()]);
    const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
    mediaRec=new MediaRecorder(outStream,mime?{mimeType:mime,videoBitsPerSecond:1500000,audioBitsPerSecond:64000}:{videoBitsPerSecond:1500000});
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data)};
    mediaRec.start(200);
  }catch(e){toast('Разрешите камеру и микрофон');stopVideoCircle(0);return}
  let lastT=Date.now();
  vrInt=setInterval(()=>{
    const now=Date.now(),dt=now-lastT;lastT=now;
    if(vrPaused)return;
    vrMs+=dt;const sec=Math.floor(vrMs/1000),cs=String(Math.floor((vrMs%1000)/10)).padStart(2,'0');
    $('#vrt').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')},${cs}`;
    $('#vr-ring').style.strokeDashoffset=String(816*(1-Math.min(1,vrMs/30000)));
    if(vrMs>=30000)stopVideoCircle(1);
  },60);
}
function stopVideoCircle(doSend){
  vrActive=false;clearInterval(vrInt);cancelAnimationFrame(vrRaf);
  $('#vrec').classList.remove('on','flash-front');
  const dur=Math.max(1,Math.round(vrMs/1000)),poster=vrPoster,once=vrOnce,rec=mediaRec;mediaRec=null;
  const cleanup=()=>{if(vrCamStream){vrCamStream.getTracks().forEach(t=>t.stop());vrCamStream=null}if(vrAudioStream){vrAudioStream.getTracks().forEach(t=>t.stop());vrAudioStream=null}$('#vrec-v').srcObject=null};
  if(rec&&rec.state!=='inactive'){
    rec.onstop=async()=>{
      cleanup();
      if(doSend&&recChunks.length){
        const mime=(rec.mimeType||'video/mp4').split(';')[0],ext=mime.includes('mp4')?'mp4':'webm';
        const blob=new Blob(recChunks,{type:mime});toast('Отправка кружка…');
        const url=await uploadMediaBlob(blob,ext);
        if(url)add({k:'vnote',d:dur,src:url,poster,once});
        else{const r=new FileReader();r.onload=()=>add({k:'vnote',d:dur,src:r.result,poster,once});r.readAsDataURL(blob)}
      }
    };
    try{rec.stop()}catch(e){cleanup()}
  }else cleanup();
}

function playVoiceMsg(vc,src,seekPct){
  if(!src)return toast('Аудиофайл отсутствует');
  if(activeVc===vc&&activeAudio&&seekPct==null){
    if(activeAudio.paused){activeAudio.play();vc.querySelector('.vp').innerHTML=I('pause',18);tickAudio()}
    else{activeAudio.pause();vc.querySelector('.vp').innerHTML=I('play',18);cancelAnimationFrame(audioRaf)}

  }

  const goP=()=>{if(seekPct!=null&&activeAudio.duration)activeAudio.currentTime=seekPct*activeAudio.duration;activeAudio.play().catch(()=>{});vc.querySelector('.vp').innerHTML=I('pause',18);tickAudio()};
  if(activeAudio.readyState>=1)goP();else activeAudio.onloadedmetadata=goP;
}
function tickAudio(){
  if(!activeAudio||!activeVc||activeAudio.paused)return;
  const pct=activeAudio.duration?(activeAudio.currentTime/activeAudio.duration)*100:0;
  activeVc.querySelector('.wv-fg').style.clipPath=`inset(0 ${Math.max(0,100-pct)}% 0 0)`;
  const rem=Math.max(0,Math.ceil((activeAudio.duration||0)-activeAudio.currentTime));
  activeVc.querySelector('.vc-tm').textContent=`${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;
  audioRaf=requestAnimationFrame(tickAudio);
}

$('#ms').onclick=e=>{
  if(lpFired)return;const t=e.target;
  const wvBtn=t.closest('[data-wave]');if(wvBtn){add({k:'st',e:wvBtn.dataset.wave});return}
  const oi=t.closest('[data-openimg]');if(oi){openLightbox(oi.dataset.openimg);return}

  const an=t.closest('.an');if(an){const k=cleanU(an.dataset.au),u=USERS[k];if(u)prof(ensureUserChat(u));return}
  const ct=t.closest('.ct-open');if(ct){const k=cleanU(ct.dataset.cu),u=USERS[k];if(u)prof(ensureUserChat(u));return}
  const w=t.closest('.mw');if(!w)return;const m=cur.m.find(x=>x.id==w.dataset.id);if(!m)return;
  if(t.closest('.rq')&&t.closest('.rq').dataset.g)return jump(t.closest('.rq').dataset.g);
  const rc=t.closest('.rc');if(rc){rxn(m,rc.dataset.e);return drawMsgs()}
  const po=t.closest('.po');if(po&&m.my==null){m.my=+po.dataset.v;m.o[m.my][1]++;saveAll();if(cur.t!=='s')pushEventToTarget(cur.u,{type:'vote',chatId:cur.id,fromU:me.u,msgId:m.id,opt:m.my}).catch(()=>{});return drawMsgs()}
  const mp=t.closest('.mp');if(mp&&mp.dataset.geo){toast('Координаты: '+mp.dataset.geo);return}
  const vp=t.closest('.vp');if(vp){playVoiceMsg(vp.closest('.vc'),vp.closest('.vc').dataset.src);return}
  const ww=t.closest('.wv-wrap');if(ww){const r=ww.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));ww.querySelector('.wv-fg').style.clipPath=`inset(0 ${100-pct*100}% 0 0)`;playVoiceMsg(ww.closest('.vc'),ww.closest('.vc').dataset.src,pct);return}
  const vn=t.closest('.vnote-wrap');
  if(vn){
    if(m.once&&!m.me&&m.viewed)return toast('Одноразовый кружок уже просмотрен');
    const vid=vn.querySelector('video'),ring=vn.querySelector('circle');
    if(!vid||!m.src)return toast('Видео не найдено');
    const ov=vn.querySelector('.vnote-once');if(ov)ov.remove();
    if(vid.paused){
      vid.muted=false;
      vid.play().then(()=>{
        vn.classList.add('playing');
        vid.ontimeupdate=()=>{if(vid.duration)ring.style.strokeDashoffset=654*(1-vid.currentTime/vid.duration)};
        if(m.once&&!m.me)vid.onended=()=>{m.viewed=1;saveAll();drawMsgs()};
      }).catch(err=>toast('Ошибка видео: '+(err.name||'формат')));
    }else{vid.pause();vn.classList.remove('playing')}
    return;
  }
  if(t.closest('.gf-btn')&&!m.me&&!m.ok){m.ok=1;playGiftAnim(m.g,'Подарок принят ✨');drawMsgs();saveAll();return}
  if(t.closest('.gf-open')){openGiftModal(m,dispName(cur));return}
};

$('#pf').onclick=e=>{

$('#sp').onclick=e=>{

  if(t.id==='spb'){if(CK==='blk')sp('prv');else{$('#sp').classList.remove('on');mset()}return}

  else if(d.st){const s=STY[d.st];ST.ac=s[1];ST.ac2=s[2];ST.wp=s[3];ST.bgc=s[4];ST.wimg='';ap();sp(CK,1)}

  else if(t.id==='rmwp'){ST.wimg='';ap();sp(CK,1)}

  else if(d.a==='pw')sp('pw')
  else if(d.a==='chpin'){const np=prompt('Новый 4-значный код:',ST.pin);if(np&&/^\d{4}$/.test(np)){ST.pin=np;ap();toast('Код обновлён')}}
  else if(d.a==='exp'){const blob=new Blob([JSON.stringify({me,P,ST,SK_PACKS},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lunarn-backup.json';a.click();toast('Бэкап скачан')}

};

$('#csi').oninput=e=>{const v=e.target.value.toLowerCase(),m=v&&[...cur.m].reverse().find(x=>pv(x).toLowerCase().includes(v));if(m)jump(m.id)};
$('#csx').onclick=()=>{$('#sq').style.display='none';$('#csi').value=''};

let stm=null,svIdx=0,svRem=6000,svStart=0,svPaused=false,svScale=1,svPinch0=0;
function strs(){
  const myKey=cleanU(me.u),myArr=getStoriesArr(myKey),hasMy=myArr.length>0;
  const others=Object.keys(STORIES).filter(k=>k!==myKey&&isContact(k)&&!isAnyBlocked(k)&&getStoriesArr(k).length>0);
  $('#sr').innerHTML=`<button data-sk="${myKey}" style="position:relative"><span class="rg${hasMy?'':' sn'}"><span>${av({n:me.n||'Я',u:me.u,h:me.h,av:me.av},52)}</span></span><span id="add-st-plus" style="position:absolute;right:4px;bottom:18px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:2px solid var(--bg)">+</span>Моя</button>`
    +others.map(k=>{const arr=getStoriesArr(k),u=USERS[k]||{n:'@'+k,u:'@'+k,h:240},allSeen=arr.every(x=>x._sn);return`<button data-sk="${k}"><span class="rg${allSeen?' sn':''}"><span>${av(Object.assign({t:'u'},u),52)}</span></span>${esc(dispName(Object.assign({t:'u'},u)).split(' ')[0])}</button>`}).join('');
}
function pickNewStory(){
  const f=$('#fi');f.accept='image/*,video/*';
  f.onchange=async()=>{
    const x=f.files[0];if(!x)return;toast('Публикация…');
    if(x.type.startsWith('video/')){
      const ext=(x.name.split('.').pop()||'mp4').slice(0,5),url=await uploadMediaBlob(x,ext)||URL.createObjectURL(x);
      saveStory({id:'st_'+Date.now(),type:'vid',src:url,dur:15,likes:{},ts:Date.now()});
    }else{
      compressImg(x,1080,async dataUrl=>{
        const blob=await (await fetch(dataUrl)).blob(),url=await uploadMediaBlob(blob,'jpg')||dataUrl;
        saveStory({id:'st_'+Date.now(),type:'img',src:url,dur:6,likes:{},ts:Date.now()});
      });
    }
    f.value='';
  };f.click();
}
function pauseStory(p){
  const bar=$('#sv-bar'),vid=$('#sv video');
  if(p&&!svPaused){svPaused=true;clearTimeout(stm);svRem=Math.max(400,svRem-(Date.now()-svStart));if(bar)bar.style.animationPlayState='paused';if(vid)vid.pause()}
  else if(!p&&svPaused){svPaused=false;svStart=Date.now();if(bar)bar.style.animationPlayState='running';if(vid)vid.play().catch(()=>{});stm=setTimeout(()=>openStory($('#sv').dataset.k,svIdx+1),svRem)}
}
function openStory(key,idx=0){
  clearTimeout(stm);svPaused=false;svScale=1;
  const myKey=cleanU(me.u),arr=getStoriesArr(key);
  if(key!==myKey&&(!isContact(key)||isAnyBlocked(key)))return toast('Публикации видны только контактам');
  if(key===myKey&&!arr.length)return pickNewStory();
  if(!arr.length)return;if(idx<0)idx=0;
  if(idx>=arr.length){$('#sv').classList.remove('on');strs();return}
  svIdx=idx;const st=arr[idx];st._sn=1;
  const u=key===myKey?me:(USERS[key]||{n:'@'+key,u:'@'+key,h:240}),likes=st.likes||{},liked=!!likes[myKey],likeCnt=Object.keys(likes).length;
  const dur=(st.dur||6);svRem=dur*1000;svStart=Date.now();
  const v=$('#sv');
  v.innerHTML=`<div class="sb-row">${arr.map((_,i)=>`<div class="sb${i<idx?' done':''}"><i${i===idx?` id="sv-bar" style="animation:sg ${dur}s linear forwards"`:''}></i></div>`).join('')}</div>
    <div class="sh2">${av(Object.assign({t:'u'},u),40)}<div><b>${esc(key===myKey?u.n:dispName(Object.assign({t:'u'},u)))}</b><small style="display:block;font-size:11px;opacity:.7">${idx+1}/${arr.length} · ${tm(st.ts||Date.now())}</small></div>${key===myKey?`<button class="ib" id="sv-add">${I('plus',20)}</button><button class="ib" id="sv-del">${I('trash',20)}</button>`:''}<button class="ib" id="sx">${I('x')}</button></div>
    <div class="sm" id="sv-stage">${st.type==='vid'?`<video class="sm-media" id="sv-med" src="${st.src}" autoplay playsinline></video>`:`<img class="sm-media" id="sv-med" src="${st.src}">`}</div>
    <div class="sr2">${key!==myKey?`<input id="sv-inp" placeholder="Ответить на публикацию…">`:'<span style="flex:1;font-size:13px;opacity:.75">Зажмите для паузы · 2 пальца — зум</span>'}<button id="sv-like" class="${liked?'liked':''}">❤️ <small style="font-size:13px">${likeCnt||''}</small></button></div>`;
  v.classList.add('on');v.dataset.k=key;
  stm=setTimeout(()=>openStory(key,idx+1),svRem);
}
async function saveStory(obj){
  const k=cleanU(me.u),arr=getStoriesArr(k);arr.push(obj);STORIES[k]=arr;saveAll();
  if(sb&&navigator.onLine)await sb.from('stories').upsert({username:k,data:arr,updated_at:Date.now()},{onConflict:'username'});
  strs();if(tabs===3)mset();openStory(k,arr.length-1);
}
$('#sr').onclick=e=>{if(e.target.closest('#add-st-plus')){pickNewStory();return}const b=e.target.closest('[data-sk]');if(b)openStory(b.dataset.sk,0)};

let svHoldT=null,svDidHold=false;
$('#sv').addEventListener('touchstart',e=>{
  if(!e.target.closest('#sv-stage'))return;
  if(e.touches.length===2){svPinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pauseStory(true);return}
  svDidHold=false;svHoldT=setTimeout(()=>{svDidHold=true;pauseStory(true)},180);
},{passive:true});
$('#sv').addEventListener('touchmove',e=>{
  if(e.touches.length===2&&svPinch0){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    svScale=Math.max(1,Math.min(3.5,d/svPinch0));const med=$('#sv-med');if(med)med.style.transform=`scale(${svScale})`;
  }
},{passive:true});
$('#sv').addEventListener('touchend',e=>{
  clearTimeout(svHoldT);
  if(e.touches.length===0){
    if(svScale>1){svScale=1;const med=$('#sv-med');if(med)med.style.transform='scale(1)'}
    if(svPaused)pauseStory(false);
  }
});
$('#sv').onclick=async e=>{
  if(svDidHold){svDidHold=false;return}
  const t=e.target,v=$('#sv'),key=v.dataset.k,myKey=cleanU(me.u);
  if(t.closest('#sx')){clearTimeout(stm);v.classList.remove('on');strs();return}
  if(t.closest('#sv-add')){clearTimeout(stm);v.classList.remove('on');pickNewStory();return}
  if(t.closest('#sv-del')){
    clearTimeout(stm);const arr=getStoriesArr(myKey);arr.splice(svIdx,1);
    if(arr.length)STORIES[myKey]=arr;else delete STORIES[myKey];
    if(sb&&navigator.onLine){if(arr.length)await sb.from('stories').upsert({username:myKey,data:arr,updated_at:Date.now()},{onConflict:'username'});else await sb.from('stories').delete().eq('username',myKey)}
    saveAll();strs();if(tabs===3)mset();if(arr.length)openStory(myKey,Math.min(svIdx,arr.length-1));else v.classList.remove('on');toast('Удалено');return;
  }
  if(t.closest('#sv-like')){
    const arr=getStoriesArr(key),st=arr[svIdx];if(!st)return;st.likes=st.likes||{};
    if(st.likes[myKey])delete st.likes[myKey];else{st.likes[myKey]=1;if(ST.vib)try{navigator.vibrate(18)}catch(err){}}
    STORIES[key]=arr;if(sb&&navigator.onLine)await sb.from('stories').upsert({username:key,data:arr,updated_at:Date.now()},{onConflict:'username'});
    saveAll();openStory(key,svIdx);return;
  }
  if(t.closest('#sv-inp')){pauseStory(true);return}
  if(t.closest('#sv-stage')){const r=$('#sv-stage').getBoundingClientRect();openStory(key,e.clientX-r.left<r.width*0.35?svIdx-1:svIdx+1)}
};
$('#sv').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='sv-inp'){
    const val=e.target.value.trim(),key=$('#sv').dataset.k;if(!val)return;
    const u=USERS[key];if(u)add({t:val,stRef:'Публикация '+dispName(Object.assign({t:'u'},u)),stKey:key,stIdx:svIdx},ensureUserChat(u));
    e.target.value='';clearTimeout(stm);$('#sv').classList.remove('on');toast('Ответ отправлен');
  }
});

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}))}
ap();ui();go(0);strs();checkAuth();initCloud();
</script>
