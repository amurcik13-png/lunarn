<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lunarn — мессенджер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lunarn">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#eef1fe;--tx:#151828;--mu:#686e8e;
  --gl:rgba(255,255,255,.58);--gb:rgba(255,255,255,.82);
  --th:rgba(255,255,255,.74);--inb:rgba(255,255,255,.84);
  --ac:#7c5cff;--ac2:#35c6ff;--sh:rgba(50,60,130,.15);--ln:rgba(115,122,168,.15);
  --fs:15px;--br:22px;--bl:24px;--wpdim:0;
  --aur:radial-gradient(46% 42% at 16% 16%,color-mix(in srgb,var(--ac) 44%,transparent),transparent),radial-gradient(42% 38% at 88% 28%,color-mix(in srgb,var(--ac2) 36%,transparent),transparent),radial-gradient(46% 42% at 54% 94%,rgba(255,107,181,.22),transparent);
  --wp:var(--aur);--wimg:none;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#070912;--tx:#f3f5ff;--mu:#9097bd;
    --gl:rgba(20,23,39,.58);--gb:rgba(255,255,255,.13);
    --th:rgba(255,255,255,.08);--inb:rgba(26,30,50,.76);
    --sh:rgba(0,0,0,.52);--ln:rgba(255,255,255,.075);
  }
}
:root[data-theme=dark]{
  --bg:#070912;--tx:#f3f5ff;--mu:#9097bd;
  --gl:rgba(20,23,39,.58);--gb:rgba(255,255,255,.13);
  --th:rgba(255,255,255,.08);--inb:rgba(26,30,50,.76);
  --sh:rgba(0,0,0,.52);--ln:rgba(255,255,255,.075);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit;border:0;background:none;outline:0;font-size:16px!important}
button{font:inherit;color:inherit;border:0;background:none;outline:0;cursor:pointer;transition:transform .24s cubic-bezier(.3,1.55,.5,1),background .2s,color .2s,opacity .2s}
button:active{transform:scale(.92)}
html,body{position:fixed;inset:0;width:100%;height:100dvh;min-height:100vh;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;background:var(--bg);color:var(--tx);font:var(--fs)/1.38 'Onest',system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:-16%;background:var(--aur);z-index:-1;pointer-events:none;animation:dr 34s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(3%,4%) rotate(5deg)}}
[data-aur="0"] body::before{display:none}
.gl{background:var(--gl);-webkit-backdrop-filter:blur(var(--bl)) saturate(195%);backdrop-filter:blur(var(--bl)) saturate(195%);border:1px solid var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -8px 18px rgba(255,255,255,.03),0 10px 30px var(--sh)}

#app{position:fixed;inset:0;width:100%;height:100dvh;display:flex;overflow:hidden}
#side{width:100%;height:100%;position:relative;flex:none;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 104px);display:none}
.pg.on{display:block}
h1{font-size:29px;font-weight:700;letter-spacing:-.03em}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px;gap:8px}
.top-acts{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--th)}

.net-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--th);color:var(--mu)}
.net-pill i{width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block}
.net-pill.off i{background:#ff4d6d;animation:bl 1s infinite}
.net-pill.loc i{background:#ffb020}

.sr{display:flex;gap:12px;overflow-x:auto;margin-bottom:12px;padding:2px 0;scrollbar-width:none}
.sr::-webkit-scrollbar{display:none}
.sr button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--mu);flex:none;width:66px}
.rg{padding:2.5px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),#ff6bb5,var(--ac))}
.rg.sn{background:var(--ln)}
.rg>span{display:block;padding:2px;border-radius:50%;background:var(--bg)}

.srch{display:flex;align-items:center;gap:8px;padding:0 15px;height:44px;border-radius:22px;margin-bottom:10px;color:var(--mu)}
.srch input{flex:1;color:var(--tx);min-width:0}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:8px 15px;border-radius:18px;white-space:nowrap;color:var(--mu);font-size:14px}
.chips .on{background:var(--ac);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 46%,transparent)}

.sec-lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 10px 6px}
.card{border-radius:28px;overflow:hidden;margin-bottom:12px}
.row{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center;transition:transform .2s,background .2s;position:relative;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--ln)}
.row:hover,.row.act{background:var(--th)}
.row:active{transform:scale(.982)}
[data-comp="1"] .row{padding-top:7px;padding-bottom:7px}

.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;position:relative;box-shadow:inset 0 1px 2px rgba(255,255,255,.42),0 4px 12px rgba(0,0,0,.16);background-size:cover!important;background-position:center!important}
.av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#34d399;border:2.5px solid var(--bg);z-index:2}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.r1 i{font-style:normal;font-size:12px;color:var(--mu);flex:none;display:inline-flex;align-items:center;gap:3px}
.r1 span{color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 em{flex:none;font-style:normal;color:var(--mu);display:flex;align-items:center;gap:5px}
.r1 s{text-decoration:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--ac);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.r1 s.mu{background:var(--mu)}
.em0{text-align:center;color:var(--mu);padding:34px 18px;font-size:14px;line-height:1.5}
.role-tag{font-size:11px;padding:2px 7px;border-radius:8px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);font-weight:600;margin-left:5px;vertical-align:middle}
.mention{color:#7ee8ff;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mw:not(.me) .mention{color:var(--ac)}

#tb{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);display:flex;padding:6px;border-radius:32px;z-index:4}
#tb button{width:76px;height:54px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mu);position:relative;z-index:1}
#tb .on{color:var(--tx);font-weight:600}
#ind{position:absolute;top:6px;left:6px;width:76px;height:54px;border-radius:26px;background:var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.45);transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
#bd{position:absolute;top:4px;left:54px;min-width:18px;height:18px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px;z-index:2}

#chat{position:absolute;inset:0;z-index:5;background:var(--wimg),var(--wp),var(--bg);background-size:cover,auto,auto;background-position:center;transform:translateX(102%);transition:transform .36s cubic-bezier(.2,.86,.2,1);overflow:hidden}
#chat::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--wpdim));pointer-events:none;z-index:0}
#chat.open{transform:none}
#emp{position:relative;z-index:1;height:100%;display:grid;place-content:center;text-align:center;color:var(--mu);gap:10px;padding:20px}
#emp div{font-size:56px}
#cv{position:absolute;inset:0;display:none;overflow:hidden;z-index:1}
#chat.has #cv{display:block}
#chat.has #emp{display:none}

#hd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:4;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:30px}
.hm{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;padding:2px 4px;border-radius:20px}
.hm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.hm small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.typ-tx{color:var(--ac2)!important;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.typ-dots{display:inline-flex;gap:2.5px;align-items:center}
.typ-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:tdot 1.2s infinite ease-in-out}
.typ-dots i:nth-child(2){animation-delay:.2s}
.typ-dots i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-3px);opacity:1}}

#pn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:14px;right:14px;z-index:3;display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:18px;font-size:13px;cursor:pointer;color:var(--ac)}
#pn span{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#sq{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:14px;right:14px;z-index:4;display:none;align-items:center;gap:8px;border-radius:20px;padding:0 14px}
#sq input{flex:1;height:42px}

#ms{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 78px) 12px calc(env(safe-area-inset-bottom,0px) + 86px)}
#cv.pinned #ms{padding-top:calc(env(safe-area-inset-top,0px) + 118px)}
.ds{text-align:center;margin:12px 0 8px}
.ds span{display:inline-block;padding:4px 13px;border-radius:14px;font-size:12px;color:var(--mu);font-weight:500}

.wave-card{margin:14vh auto 0;max-width:270px;padding:24px 18px;border-radius:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .35s}
.wave-em{font-size:84px;line-height:1;display:inline-block;animation:fy 2.8s ease-in-out infinite;cursor:pointer}
.wave-btn{padding:10px 18px;border-radius:20px;background:var(--ac);color:#fff;font-weight:600;font-size:14px;margin-top:4px}

.mw{position:relative;display:flex;flex-direction:column;align-items:flex-start;margin:5px 0;touch-action:pan-y}
.mw.me{align-items:flex-end}
.mw.grp{margin-top:2px}
.mw.center{align-items:center;margin:12px 0}
.mw.vapor{transition:opacity .48s ease,transform .48s ease,filter .48s ease;opacity:0;transform:scale(.82) translateY(-14px);filter:blur(10px)}
.sw-ic{position:absolute;right:8px;top:50%;transform:translateY(-50%) scale(.4);width:34px;height:34px;border-radius:50%;background:var(--gl);border:1px solid var(--gb);color:var(--ac);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.mw-inner{display:flex;flex-direction:column;align-items:inherit;max-width:100%;will-change:transform}
.mw.fh .b{box-shadow:0 0 0 3px var(--ac2),0 8px 26px color-mix(in srgb,var(--ac2) 45%,transparent)}
.mw.holding .b{transform:scale(.96)}

.b{max-width:min(82vw,420px);padding:9px 13px 7px;border-radius:var(--br) var(--br) var(--br) 6px;background:var(--inb);border:1px solid var(--gb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 4px 16px rgba(0,0,0,.08);overflow-wrap:anywhere;transition:box-shadow .3s,transform .22s cubic-bezier(.3,1.5,.5,1)}
.b::after{content:"";display:table;clear:both}
.me .b{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 38%,var(--ac2)));color:#fff;border-color:rgba(255,255,255,.18);border-radius:var(--br) var(--br) 6px var(--br);box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 30%,transparent)}
[data-grad="0"] .me .b{background:var(--ac)}
.mw.nw .b,.mw.nw .gf-card{animation:pop .28s cubic-bezier(.3,1.35,.5,1)}
.mw.edanim .b{animation:edFlash .55s cubic-bezier(.22,1.2,.36,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@keyframes edFlash{0%{transform:scale(.95);box-shadow:0 0 0 0 var(--ac2)}50%{transform:scale(1.03);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac2) 60%,transparent)}100%{transform:scale(1)}}

.b.photo-b{padding:3px!important;border-radius:20px!important;overflow:hidden;position:relative}
.b.photo-b .im{display:block;max-width:min(74vw,300px);max-height:310px;border-radius:17px;cursor:pointer;object-fit:cover}
.b.photo-b .mt{position:absolute;right:9px;bottom:9px;margin:0;padding:2px 8px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;opacity:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.b.big{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;padding:2px!important;color:inherit}
.b.big .mt{background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:10px;opacity:1}

.mt{float:right;margin:5px 0 -1px 10px;font-size:11px;opacity:.78;display:inline-flex;align-items:center;gap:3px}
.ticks{display:inline-flex;align-items:center;width:16px;height:12px;vertical-align:middle}
.ticks svg{width:16px;height:12px;overflow:visible}
.ticks .ck1,.ticks .ck2{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ticks .ck2{opacity:0;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .4s ease,opacity .25s ease}
.ticks.rd{color:#7ee8ff}
.ticks.rd .ck2{opacity:1;stroke-dashoffset:0}
.ticks.anim .ck2{animation:tickDraw .45s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tickDraw{from{opacity:0;stroke-dashoffset:18}to{opacity:1;stroke-dashoffset:0}}
[data-ticks="0"] .ticks{display:none!important}
.clk{display:inline-flex;width:13px;height:13px;opacity:.85;animation:spinClk 2s linear infinite}
@keyframes spinClk{to{transform:rotate(360deg)}}

.fw{font-size:12px;color:var(--ac2);font-weight:600;margin-bottom:3px}.me .fw{color:rgba(255,255,255,.9)}
.an{font-size:13px;font-weight:700;margin-bottom:2px;cursor:pointer;display:inline-block}
.an:hover{text-decoration:underline}
.rq{border-left:3px solid var(--ac2);padding:4px 9px;margin:2px 0 6px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.12);border-radius:4px 10px 10px 4px}
.me .rq{border-left-color:#fff;background:rgba(255,255,255,.18)}
.rq b{display:block;font-size:12px}
.rx{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.rc{padding:3px 9px;border-radius:12px;font-size:13px;background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.rc.my{background:var(--ac);color:#fff;border-color:transparent}

.gf-card{width:min(78vw,272px);padding:18px 16px 15px;border-radius:28px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.32),transparent 65%),linear-gradient(155deg,color-mix(in srgb,var(--ac) 86%,#1b1040),color-mix(in srgb,var(--ac2) 55%,#ff5ea8));color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 36px color-mix(in srgb,var(--ac) 40%,rgba(0,0,0,.35))}
.gf-card::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 280deg,rgba(255,255,255,.22) 320deg,transparent 360deg);animation:spinGlow 8s linear infinite;pointer-events:none}
@keyframes spinGlow{to{transform:rotate(360deg)}}
.gf-card>*{position:relative;z-index:1}
.gf-who{font-size:12px;opacity:.86;margin-bottom:4px;font-weight:500}
.gf-em{font-size:66px;line-height:1.1;margin:4px 0 6px;display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-6px) scale(1.05) rotate(3deg)}}
.gf-name{font-size:17px;font-weight:700;display:block}
.gf-txt{margin:8px 0 4px;padding:7px 10px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13.5px;line-height:1.35}
.gf-price{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:600;margin-top:6px}
.gf-btn{display:block;width:100%;margin-top:10px;padding:9px;border-radius:16px;background:rgba(255,255,255,.94);color:#171a2b;font-weight:700;font-size:13.5px}
.gf-ok{display:block;margin-top:8px;font-size:12px;opacity:.88}

.vc{display:flex;align-items:center;gap:10px;width:236px}
.vp{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.wv-wrap{position:relative;flex:1;height:30px;cursor:pointer;display:flex;align-items:center}
.wv-layer{display:flex;align-items:center;gap:2px;width:100%;height:100%}
.wv-layer i{flex:1;border-radius:2px;background:currentColor;min-height:4px}
.wv-bg{opacity:.35}
.wv-fg{position:absolute;inset:0;clip-path:inset(0 100% 0 0);transition:clip-path .05s linear;opacity:1}
.vc-tm{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85;min-width:30px;text-align:right}
.rec-wv{display:flex;align-items:center;gap:2px;flex:1;height:26px;overflow:hidden}
.rec-wv i{width:3px;border-radius:2px;background:var(--ac);transition:height .08s ease;min-height:4px}

.vnote-box{position:relative;width:214px;padding-bottom:10px}
.vnote-wrap{position:relative;width:214px;height:214px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.32);box-shadow:0 12px 30px rgba(0,0,0,.35);cursor:pointer;background:#0e101c}
.vnote-wrap video{width:100%;height:100%;object-fit:cover;display:block;transform:none!important}
.vnote-ring{position:absolute;inset:0;pointer-events:none;transform:rotate(-90deg)}
.vnote-ring circle{fill:none;stroke:var(--ac2);stroke-width:4;stroke-dasharray:654;stroke-dashoffset:654;transition:stroke-dashoffset .1s linear}
.vnote-badge{position:absolute;left:2px;bottom:-14px;padding:2px 9px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2}
.vnote-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.22);color:#fff;transition:opacity .2s}
.vnote-wrap.playing .vnote-play{opacity:0}

.po{position:relative;display:flex;justify-content:space-between;padding:8px 11px;margin:4px 0;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.12);cursor:pointer;min-width:210px}
.po .pb{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.24);transition:width .45s}
.po i,.po em{position:relative;font-style:normal}.po.my{outline:2px solid rgba(255,255,255,.78)}
.pq{font-weight:600;margin-bottom:4px}
.gif-box{position:relative;border-radius:16px;overflow:hidden;max-width:240px}
.gif-box img{display:block;width:100%;max-height:220px;object-fit:cover}
.gif-tag{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700}
.fl{display:flex;gap:10px;align-items:center;min-width:195px;cursor:pointer}.fl small{display:block;opacity:.75;font-size:12px}
.fi{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}

[data-wp=ocean]{--wp:linear-gradient(160deg,rgba(53,198,255,.45),rgba(52,211,153,.32))}
[data-wp=forest]{--wp:linear-gradient(170deg,rgba(52,211,153,.35),rgba(8,60,50,.45))}
[data-wp=plain]{--wp:linear-gradient(var(--bg),var(--bg))}

#sv{position:fixed;inset:0;z-index:75;display:none;flex-direction:column;background:#000;color:#fff}
#sv.on{display:flex;animation:pop .25s}
.sb-row{display:flex;gap:4px;margin:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.sb{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.sb i{display:block;height:100%;background:#fff;width:0%}
.sb.done i{width:100%}
@keyframes sg{from{width:0}to{width:100%}}
.sh2{display:flex;align-items:center;gap:10px;padding:10px 12px}.sh2>div{flex:1;min-width:0}
.sm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background-size:cover!important;background-position:center!important;position:relative;overflow:hidden}
.sm video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.sr2{display:flex;align-items:center;gap:8px;padding:12px 14px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(0,0,0,.78),transparent)}
.sr2 input{flex:1;height:42px;padding:0 14px;border-radius:21px;background:rgba(255,255,255,.18);color:#fff}
.sr2 input::placeholder{color:rgba(255,255,255,.7)}
.sr2 button{font-size:21px;height:44px;min-width:44px;padding:0 10px;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.sr2 button.liked{background:#ff4d6d}

#auth,#pinlock{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:var(--aur),var(--bg);overflow-y:auto}
#auth.on,#pinlock.on{display:flex;animation:fadeIn .25s}
.auth-card{width:min(100%,395px);border-radius:34px;padding:26px 22px;text-align:center;background:color-mix(in srgb,var(--bg) 74%,transparent)}
.auth-av{width:84px;height:84px;border-radius:50%;margin:14px auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:30px;font-weight:700;cursor:pointer;overflow:hidden;border:2px solid var(--gb)}
.auth-av img{width:100%;height:100%;object-fit:cover}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:20px 0 26px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac);transition:.2s}
.pin-dots span.f{background:var(--ac);transform:scale(1.15)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pin-pad button{width:72px;height:72px;border-radius:50%;font-size:24px;font-weight:600;background:var(--gl);border:1px solid var(--gb)}

#tt{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-95px);z-index:95;padding:10px 18px;border-radius:22px;transition:transform .35s cubic-bezier(.3,1.4,.5,1);font-size:14px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#tt.on{transform:translate(-50%,0)}
.cf{position:fixed;z-index:85;font-size:22px;pointer-events:none;animation:cf 1.3s cubic-bezier(.1,.7,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),calc(var(--y) + 170px)) rotate(360deg);opacity:0}}
.dbl-pop{position:fixed;z-index:85;font-size:44px;pointer-events:none;transform:translate(-50%,-50%);animation:dblpop .65s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes dblpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}40%{transform:translate(-50%,-70%) scale(1.25);opacity:1}100%{transform:translate(-50%,-125%) scale(.8);opacity:0}}
.chg{padding:12px 16px;border-top:1px solid var(--ln)}
.chg b{display:inline-block;padding:2px 9px;border-radius:10px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);font-size:12px;margin-bottom:6px}
.chg ul{padding-left:18px;font-size:13.5px;color:var(--mu);display:flex;flex-direction:column;gap:4px}

@media(min-width:900px){

  .back{display:none}

async function pullPendingInbox(){

function subscribeMyChats(){
  if(!sb)return;
  sbChannels.forEach(ch=>sb.removeChannel(ch));sbChannels=[];
  const myKey=cleanU(me.u);

  const chGlobal=sb.channel('lunarn_global')
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},payload=>{
      if(payload.new)syncUserRow(payload.new);
      if(tabs===0)list();if(tabs===1)cons();strs();saveAll();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'stories'},payload=>{
      if(payload.eventType==='DELETE'&&payload.old){delete STORIES[payload.old.username]}
      else if(payload.new){STORIES[payload.new.username]=payload.new.data}
      strs();if(tabs===3)mset();saveAll();
    })
    .on('broadcast',{event:'typing'},({payload})=>{
      if(payload)handleTypingEvent(payload);
    })
    .subscribe(status=>{
      dbOnline=(status==='SUBSCRIBED');
      updateNetUI();
      if(dbOnline){publishMyProfile(true);flushOutbox();pullPendingInbox()}
    });
  rtLive=chGlobal;
  sbChannels.push(chGlobal);

  if(myKey){
    const chInbox=sb.channel('lunarn_inbox_'+myKey)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'inbox',filter:`target_u=eq.${myKey}`},payload=>{
        const row=payload.new;if(!row)return;
        handleIncomingEvent(row.payload);
        sb.from('inbox').delete().eq('id',row.id).then(()=>{});
      })
      .subscribe();
    sbChannels.push(chInbox);
  }
}

function handleIncomingEvent(ev){
  if(!ev)return;
  if(ev.evId){if(seenEv.has(ev.evId))return;seenEv.add(ev.evId);if(seenEv.size>300)seenEv.clear()}
  const myKey=cleanU(me.u);
  if(ev.targetKey&&ev.targetKey!==myKey)return;
  if(ev.type==='msg'){
    let p=P.find(x=>x.id===ev.chatId||(ev.fromU&&cleanU(x.u)===cleanU(ev.fromU)&&x.t==='u'));
    if(!p){
      p={id:ev.chatId||chatRoomId(myKey,ev.fromU),n:ev.sender.n,u:fmtU(ev.sender.u),h:ev.sender.h||240,av:ev.sender.av||'',t:ev.chatType||'u',role:'member',on:1,s:'онлайн',m:[]};
      P.unshift(p);
    }
    p.typing=false;updateChatStatus(p);
    if(!p.m.some(x=>x.id===ev.msg.id)){
      const incoming=Object.assign({},ev.msg,{me:0,nw:1,pending:0});
      p.m.push(incoming);
      if(cur===p){
        drawMsgs(1);
        if(ST.ro)pushEventToTarget(ev.fromU,{type:'read',chatId:p.id,fromU:me.u}).catch(()=>{});
      }else{
        p.un=(p.un|0)+1;
        if(!p.mute&&ST.n)toast(`${p.n}: ${ST.prev?pv(incoming):'Новое сообщение'}`);
      }
      if(incoming.k==='gift'&&tabs===3)mset();
      fx();list();saveAll();
    }
  }else if(ev.type==='read'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    if(p){p.m.forEach(m=>{if(m.me&&!m.rd){m.rd=1;m._rdAnim=1}});if(cur===p)drawMsgs();list();saveAll()}
  }else if(ev.type==='del'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    if(p){
      const el=cur===p?$(`#ms [data-id="${ev.msgId}"]`):null;
      const done=()=>{p.m=p.m.filter(x=>x.id!==ev.msgId);if(cur===p){pin();drawMsgs()}list();saveAll()};
      if(el)vaporizeEl(el,done);else done();
    }
  }else if(ev.type==='edit'){
    const p=P.find(x=>x.id===ev.chatId||cleanU(x.u)===cleanU(ev.fromU));
    const m=p&&p.m.find(x=>x.id===ev.msgId);
    if(m){m.t=ev.text;m.ed=1;m._edAnim=1;if(cur===p)drawMsgs();list();saveAll()}
  }else if(ev.type==='call'){
    if(ev.ts&&Date.now()-ev.ts>25000)return;
    if(callTarget)return;
    const p=ensureUserChat(ev.sender);
    call(p,!!ev.vid,true,ev.offer,ev.callId);
  }else if(ev.type==='webrtc'){
    handleWebRTCSignal(ev);
  }
}

function compressImg(file,maxW,cb){

  r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,maxW/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};img.src=r.result};

}

function bindSwipeBack(el,onClose){
  let x0=0,y0=0,active=0,dx=0;
  el.addEventListener('touchstart',e=>{
    if(!ST.swbk||!el.classList.contains('on')&&!el.classList.contains('open'))return;
    if(e.touches.length!==1)return;
    if(e.target.closest('input[type=range],.wv-wrap,.sr,.chips,.pk-bar'))return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;active=0;dx=0;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(e.touches.length!==1)return;
    const cx=e.touches[0].clientX-x0,cy=e.touches[0].clientY-y0;
    if(!active){
      if(Math.abs(cy)>Math.abs(cx)&&Math.abs(cy)>10){x0=-999;return}
      if(cx>16&&x0>-900){active=1;el.style.transition='none'}
    }
    if(active&&cx>0){dx=cx;el.style.transform=`translateX(${dx}px)`}
  },{passive:true});
  const end=()=>{
    if(!active)return;
    el.style.transition='';
    if(dx>90){el.style.transform='';onClose()}else{el.style.transform=''}
    active=0;dx=0;
  };
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}

function bindExpandAvatar(container,hero){
  let y0=0,pull=0;
  hero.querySelector('.pav-box').onclick=()=>hero.classList.toggle('exp');
  container.addEventListener('touchstart',e=>{
    if(container.scrollTop<=2&&e.touches.length===1){y0=e.touches[0].clientY;pull=1}else pull=0;
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    if(!pull)return;
    const dy=e.touches[0].clientY-y0;
    if(dy>36&&!hero.classList.contains('exp')){hero.classList.add('exp');pull=0;if(ST.vib)try{navigator.vibrate(14)}catch(err){}}
    else if(dy<-32&&hero.classList.contains('exp')){hero.classList.remove('exp');pull=0}
  },{passive:true});
  container.addEventListener('scroll',()=>{if(container.scrollTop>14&&hero.classList.contains('exp'))hero.classList.remove('exp')},{passive:true});
}

function renderProfShowcase(targetEl,msgs,userKey,isSelf,tab){
  const uKey=cleanU(userKey);
  const gifts=msgs.filter(m=>m.k==='gift'&&(isSelf?!m.me:!!m.me));
  const pubs=getStoriesArr(uKey);
  if(!tab)tab=gifts.length?'gifts':'pubs';
  if(tab==='gifts'&&!gifts.length)tab='pubs';

  let body='';
  if(tab==='gifts'){
    body=`<div class="pgrid3">${gifts.map((m,idx)=>`<button class="pgift" data-gfidx="${idx}"><span>${m.g}</span><b>${esc(m.gn)}</b><small>🌙 ${m.gp}</small></button>`).join('')}</div>`;
  }else{
    const addCard=isSelf?`<button class="pmed" id="add-pub-btn" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--gb);color:var(--ac);font-weight:600;font-size:12px">${I('plus',24)}<span>Добавить</span></button>`:'';
    const itemsHtml=pubs.map((st,idx)=>`<div class="pmed" data-pubidx="${idx}">${st.type==='vid'?`<video src="${st.src}" muted playsinline></video><span class="pmed-tag">▶ Видео</span>`:`<img src="${st.src}">`}</div>`).join('');
    body=(pubs.length||isSelf)?`<div class="pgrid3">${addCard}${itemsHtml}</div>`:'<p class="em0" style="padding:22px">Публикаций пока нет</p>';
  }

  targetEl.innerHTML=`
    <div class="ptabs">
      ${gifts.length?`<button data-pt="gifts" class="${tab==='gifts'?'on':''}">Подарки (${gifts.length})</button>`:''}
      <button data-pt="pubs" class="${tab==='pubs'?'on':''}">Публикации (${pubs.length})</button>
    </div>${body}`;

  targetEl.onclick=e=>{
    const tb=e.target.closest('[data-pt]');if(tb){renderProfShowcase(targetEl,msgs,uKey,isSelf,tb.dataset.pt);return}
    const gf=e.target.closest('[data-gfidx]');if(gf){const m=gifts[+gf.dataset.gfidx];if(m)openGiftModal(m,isSelf?null:m.a);return}
    if(e.target.closest('#add-pub-btn')){pickNewStory();return}
    const pb=e.target.closest('[data-pubidx]');if(pb){openStory(uKey,+pb.dataset.pubidx);return}
  };
}

let mediaRec=null,mediaStream=null,recChunks=[],recPeaks=[],audioCtx=null,analyser=null,wvRaf=null;

async function startAudioRec(){
  rs=0;recChunks=[];recPeaks=[];
  $('#rc').classList.add('on');$('#rt').textContent='0:00';$('#rec-wv').innerHTML='';
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(mediaStream);
    mediaRec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    mediaRec.start();
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(mediaStream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;src.connect(analyser);
    const buf=new Uint8Array(analyser.frequencyBinCount);
    const sample=()=>{
      analyser.getByteTimeDomainData(buf);
      let max=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]-128)/128;if(v>max)max=v}
      const h=Math.max(4,Math.min(26,Math.round(4+max*48)));
      recPeaks.push(h);
      const bar=document.createElement('i');bar.style.height=h+'px';
      const wv=$('#rec-wv');wv.append(bar);if(wv.children.length>36)wv.firstChild.remove();
      wvRaf=setTimeout(()=>requestAnimationFrame(sample),70);
    };
    sample();
  }catch(e){toast('Разрешите доступ к микрофону для записи аудио');$('#rc').classList.remove('on');return}
  ri=setInterval(()=>{rs++;$('#rt').textContent=Math.floor(rs/60)+':'+String(rs%60).padStart(2,'0')},1000);
}

function stopAudioRec(doSend){
  clearInterval(ri);clearTimeout(wvRaf);$('#rc').classList.remove('on');
  if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}
  const dur=Math.max(rs,1);
  const peaks=[];const n=28,len=recPeaks.length||1;
  for(let i=0;i<n;i++){peaks.push(recPeaks[Math.min(len-1,Math.floor(i*len/n))]||8)}
  if(mediaRec&&mediaRec.state!=='inactive'){
    mediaRec.onstop=()=>{
      if(doSend){
        const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
        const r=new FileReader();r.onload=()=>add({k:'voice',d:dur,src:r.result,peaks});r.readAsDataURL(blob);
      }
      if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());
      mediaRec=null;mediaStream=null;
    };
    mediaRec.stop();
  }
}

let vrInt=null,vrSec=0,vrFacing='user',vrTorch=false,vrCamStream=null,vrCanvas=null,vrDrawTimer=null,vrAudioStream=null,vrActive=false;

async function openVrCam(){

  }

async function startVideoCircle(){
  if(vrActive)return;
  vrActive=true;vrSec=0;recChunks=[];vrTorch=false;
  $('#vrec').classList.add('on');$('#vrec').classList.remove('flash-front');
  $('#vr-torch').classList.remove('on');$('#vrt').textContent='0:00 / 0:30';
  $('#vr-ring').style.strokeDashoffset='816';
  try{
    await openVrCam();
    if(!vrActive)return;
    vrAudioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(!vrActive){stopVideoCircle(0);return}
    vrCanvas=document.createElement('canvas');vrCanvas.width=240;vrCanvas.height=240;
    const ctx=vrCanvas.getContext('2d'),vid=$('#vrec-v');
    vrDrawTimer=setInterval(()=>{
      if(!vrActive||vid.readyState<2)return;
      const vw=vid.videoWidth||240,vh=vid.videoHeight||240,s=Math.min(vw,vh);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(vid,(vw-s)/2,(vh-s)/2,s,s,0,0,240,240);
    },50);
    const outStream=new MediaStream([...vrCanvas.captureStream(20).getVideoTracks(),...vrAudioStream.getAudioTracks()]);
    const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
    const opts=mime?{mimeType:mime,videoBitsPerSecond:260000,audioBitsPerSecond:32000}:{videoBitsPerSecond:260000};
    mediaRec=new MediaRecorder(outStream,opts);
    mediaRec.ondataavailable=e=>{if(e.data&&e.data.size>0)recChunks.push(e.data)};
    mediaRec.start(250);
  }catch(e){
    toast('Разрешите камеру и микрофон');stopVideoCircle(0);return;
  }
  vrInt=setInterval(()=>{
    vrSec++;
    $('#vrt').textContent=`${Math.floor(vrSec/60)}:${String(vrSec%60).padStart(2,'0')} / 0:30`;
    $('#vr-ring').style.strokeDashoffset=String(816*(1-vrSec/30));
    if(vrSec>=30)stopVideoCircle(1);
  },1000);
}

function stopVideoCircle(doSend){
  vrActive=false;
  clearInterval(vrInt);clearInterval(vrDrawTimer);
  $('#vrec').classList.remove('on','flash-front');
  const dur=Math.max(vrSec,1);
  const rec=mediaRec;mediaRec=null;
  const cleanup=()=>{
    if(vrCamStream){vrCamStream.getTracks().forEach(t=>t.stop());vrCamStream=null}
    if(vrAudioStream){vrAudioStream.getTracks().forEach(t=>t.stop());vrAudioStream=null}
    $('#vrec-v').srcObject=null;
  };
  if(rec&&rec.state!=='inactive'){
    rec.onstop=()=>{
      cleanup();
      if(doSend&&recChunks.length){
        const blob=new Blob(recChunks,{type:rec.mimeType||'video/webm'});
        if(blob.size>900000)return toast('Кружок слишком тяжёлый, запишите короче');
        const r=new FileReader();r.onload=()=>add({k:'vnote',d:dur,src:r.result});r.readAsDataURL(blob);
      }
    };
    try{rec.stop()}catch(e){cleanup()}
  }else cleanup();
}

let activeAudio=null,activeVc=null,audioRaf=null;
function stopActiveAudio(){
  if(activeAudio){activeAudio.pause();activeAudio=null}
  cancelAnimationFrame(audioRaf);
  if(activeVc){activeVc.querySelector('.vp').innerHTML=I('play',18);activeVc=null}
}
function playVoiceMsg(vc,src,seekPct){
  if(!src)return toast('Аудиофайл отсутствует');
  if(activeVc===vc&&activeAudio&&seekPct==null){
    if(activeAudio.paused){activeAudio.play();vc.querySelector('.vp').innerHTML=I('pause',18);tickAudio()}
    else{activeAudio.pause();vc.querySelector('.vp').innerHTML=I('play',18);cancelAnimationFrame(audioRaf)}
    return;
  }
  if(activeVc!==vc){
    stopActiveAudio();
    activeVc=vc;activeAudio=new Audio(src);
    activeAudio.onended=()=>{vc.querySelector('.wv-fg').style.clipPath='inset(0 100% 0 0)';stopActiveAudio()};
  }
  const startPlay=()=>{
    if(seekPct!=null&&activeAudio.duration)activeAudio.currentTime=seekPct*activeAudio.duration;
    activeAudio.play().catch(()=>{});
    vc.querySelector('.vp').innerHTML=I('pause',18);
    tickAudio();
  };
  if(activeAudio.readyState>=1)startPlay();else activeAudio.onloadedmetadata=startPlay;
}
function tickAudio(){
  if(!activeAudio||!activeVc||activeAudio.paused)return;
  const pct=activeAudio.duration?(activeAudio.currentTime/activeAudio.duration)*100:0;
  activeVc.querySelector('.wv-fg').style.clipPath=`inset(0 ${Math.max(0,100-pct)}% 0 0)`;
  const rem=Math.max(0,Math.ceil((activeAudio.duration||0)-activeAudio.currentTime));
  activeVc.querySelector('.vc-tm').textContent=`${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;
  audioRaf=requestAnimationFrame(tickAudio);
}

let cs=null,callToneInt=null,callTimeout=null,callLocalStream=null,callSec=0,callTarget=null,callFacing='user',pc=null,pendingOffer=null,iceQueue=[],callIsVid=false,curCallId='';
const RTC_CFG={
  iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun.relay.metered.ca:80'},

  ]
};

function playTone(incoming){
  if(!ST.snd)return;
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    if(incoming){
      o.type='sine';o.frequency.setValueAtTime(587,a.currentTime);o.frequency.setValueAtTime(784,a.currentTime+.16);
      g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.45);
      o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.46);
    }else{
      o.frequency.value=425;g.gain.value=.025;
      o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.55);
    }
    setTimeout(()=>a.close(),650);
  }catch(e){}
}

function startCallTimer(){
  if(cs)return;
  clearInterval(callToneInt);clearTimeout(callTimeout);
  const e=$('#cs');if(!e)return;
  e.textContent='00:00';
  cs=setInterval(()=>{callSec++;const el=$('#cs');if(el)el.textContent=String(Math.floor(callSec/60)).padStart(2,'0')+':'+String(callSec%60).padStart(2,'0')},1000);
}

async function getSafeMedia(wantVid){
  try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:wantVid?{facingMode:callFacing}:false})}
  catch(e){
    try{return await navigator.mediaDevices.getUserMedia({audio:true,video:false})}
    catch(e2){return null}
  }
}

function setupPeer(targetU,keepQueue){
  if(pc){try{pc.close()}catch(e){}}
  if(!keepQueue)iceQueue=[];
  pc=new RTCPeerConnection(RTC_CFG);
  pc.onicecandidate=e=>{
    if(e.candidate)pushEventToTarget(targetU,{type:'webrtc',callId:curCallId,sig:'ice',fromU:me.u,candidate:e.candidate}).catch(()=>{});
  };
  pc.ontrack=e=>{
    const remV=$('#call-remote');
    if(remV){
      const stream=e.streams[0]||new MediaStream([e.track]);
      remV.srcObject=stream;
      if(stream.getVideoTracks().length||e.track.kind==='video')remV.style.display='block';
      remV.play().catch(()=>{});
    }
  };
  pc.oniceconnectionstatechange=()=>{
    if(!pc)return;
    const st=pc.iceConnectionState;
    if(st==='connected'||st==='completed')startCallTimer();
    else if(st==='failed'){toast('Сбой соединения');endCall(true)}
  };
  if(callLocalStream&&callLocalStream.getTracks().length){
    callLocalStream.getTracks().forEach(t=>pc.addTrack(t,callLocalStream));
  }else{
    pc.addTransceiver('audio',{direction:'recvonly'});
    if(callIsVid)pc.addTransceiver('video',{direction:'recvonly'});
  }
  return pc;
}

async function call(p,isVid,incoming,offer,inCallId){
  if(p.t==='s')return toast('Нельзя позвонить в Избранное');
  callTarget=p;callSec=0;callFacing='user';callIsVid=!!isVid;pendingOffer=offer||null;
  curCallId=inCallId||('call_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));
  const c=$('#call');
  const bg=p.av?`background-image:url(${p.av})`:`background:linear-gradient(155deg,hsl(${p.h||240} 70% 35%),#070912)`;
  c.innerHTML=`
    <div id="call-bg" style="${bg}"></div>
    <video id="call-remote" autoplay playsinline></video>
    <video id="call-self" autoplay playsinline muted></video>
    <div class="call-top">
      <div class="call-ring-wrap"><span class="call-pulse"></span><span class="call-pulse"></span>${av(p,112)}</div>
      <h2 style="font-size:26px">${esc(p.n)}</h2>
      <p id="cs" style="color:rgba(255,255,255,.85);margin-top:4px">${incoming?(isVid?'Входящий видеозвонок…':'Входящий звонок…'):(isVid?'Видеовызов…':'Вызов…')}</p>
      <div class="call-qual">🔒 WebRTC · Живой звук и видео</div>
    </div>
    <div class="call-bot">
      ${incoming?`<div class="cx" id="call-in-btns">
        <button class="cbt" id="c-acc" style="background:#34d399;width:68px;height:68px" aria-label="Принять">${I('phone',28)}</button>
        <button class="cbt end" id="c-rej" style="width:68px;height:68px" aria-label="Отклонить">${I('phone',28)}</button>
      </div>`:''}
      <div class="cx" id="call-act-btns" style="${incoming?'display:none':''}">
        <button class="cbt" id="cmic">${I('mic',24)}</button>
        <button class="cbt${isVid?' on':''}" id="cvid">${I('video',24)}</button>
        <button class="cbt" id="cflip" aria-label="Перевернуть камеру">${I('flip',24)}</button>
        <button class="cbt end" id="ce">${I('phone',24)}</button>
      </div>
    </div>`;
  c.classList.add('on');
  playTone(incoming);callToneInt=setInterval(()=>playTone(incoming),1900);
  clearTimeout(callTimeout);callTimeout=setTimeout(()=>{if(!cs&&callTarget){toast('Нет ответа');endCall(false)}},28000);

  if(!incoming){
    callLocalStream=await getSafeMedia(isVid);
    if(!callLocalStream)toast('Микрофон не найден — режим прослушивания');
    else if(isVid&&callLocalStream.getVideoTracks().length){$('#call-self').srcObject=callLocalStream;$('#call-self').style.display='block'}
    const peer=setupPeer(p.u,false);
    const off=await peer.createOffer();
    await peer.setLocalDescription(off);
    await pushEventToTarget(p.u,{type:'call',callId:curCallId,ts:Date.now(),vid:isVid,offer:off,sender:{n:me.n,u:me.u,h:me.h,av:me.av}}).catch(()=>{toast('Ошибка вызова');endCall(true)});
  }
}

async function acceptIncomingCall(){
  if(!callTarget||!pendingOffer)return;
  clearInterval(callToneInt);clearTimeout(callTimeout);
  $('#call-in-btns').style.display='none';
  $('#call-act-btns').style.display='flex';
  $('#cs').textContent='Соединение…';
  callLocalStream=await getSafeMedia(callIsVid);
  if(!callLocalStream)toast('Микрофон не найден — вы слышите собеседника');
  else if(callIsVid&&callLocalStream.getVideoTracks().length){$('#call-self').srcObject=callLocalStream;$('#call-self').style.display='block'}
  const peer=setupPeer(callTarget.u,true);
  await peer.setRemoteDescription(new RTCSessionDescription(pendingOffer));
  for(const cand of iceQueue)await peer.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
  iceQueue=[];
  const ans=await peer.createAnswer();
  await peer.setLocalDescription(ans);
  await pushEventToTarget(callTarget.u,{type:'webrtc',callId:curCallId,sig:'answer',fromU:me.u,answer:ans}).catch(()=>{});
  startCallTimer();
}

async function handleWebRTCSignal(ev){
  if(ev.callId&&curCallId&&ev.callId!==curCallId)return;
  if(ev.sig==='hangup'||ev.sig==='reject'){
    if(callTarget)toast(ev.sig==='reject'?'Вызов отклонён':'Звонок завершён');
    endCall(true);return;
  }
  if(!pc){
    if(ev.sig==='ice'&&ev.candidate)iceQueue.push(ev.candidate);
    return;
  }
  if(ev.sig==='answer'&&ev.answer){
    await pc.setRemoteDescription(new RTCSessionDescription(ev.answer)).catch(()=>{});
    for(const cand of iceQueue)await pc.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
    iceQueue=[];startCallTimer();
  }else if(ev.sig==='ice'&&ev.candidate){
    if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(ev.candidate)).catch(()=>{});
    else iceQueue.push(ev.candidate);
  }
}

async function toggleCallVideo(enable){
  const selfV=$('#call-self');if(!selfV)return;
  if(callLocalStream){
    const oldVt=callLocalStream.getVideoTracks()[0];
    if(oldVt){oldVt.stop();callLocalStream.removeTrack(oldVt)}
  }
  if(enable){
    try{
      const vs=await navigator.mediaDevices.getUserMedia({video:{facingMode:callFacing}});
      const nt=vs.getVideoTracks()[0];
      if(!callLocalStream)callLocalStream=new MediaStream();
      callLocalStream.addTrack(nt);
      selfV.srcObject=callLocalStream;selfV.style.display='block';
      if(pc){const snd=pc.getSenders().find(s=>s.track&&s.track.kind==='video');if(snd)snd.replaceTrack(nt);else pc.addTrack(nt,callLocalStream)}
    }catch(e){toast('Камера недоступна')}
  }else selfV.style.display='none';
}

function endCall(remoteEnded){
  clearInterval(cs);cs=null;clearInterval(callToneInt);clearTimeout(callTimeout);
  const tgt=callTarget,cid=curCallId,wasMiss=!!(pendingOffer&&!callSec);
  callTarget=null;pendingOffer=null;curCallId='';iceQueue=[];
  if(!remoteEnded&&tgt)pushEventToTarget(tgt.u,{type:'webrtc',callId:cid,sig:wasMiss?'reject':'hangup',fromU:me.u}).catch(()=>{});
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(callLocalStream){callLocalStream.getTracks().forEach(t=>t.stop());callLocalStream=null}
  $('#call').classList.remove('on');
  if(tgt){const dur=callSec?String(Math.floor(callSec/60)).padStart(2,'0')+':'+String(callSec%60).padStart(2,'0'):'';LG.unshift([tgt.id,wasMiss?'miss':'out',Date.now(),dur,tgt.n]);saveAll();if(tabs===2)logs()}
}

$('#ms').onscroll=()=>{const m=$('#ms');$('#dn').style.display=m.scrollHeight-m.scrollTop-m.clientHeight>260?'grid':'none'};
$('#dn').onclick=()=>$('#ms').scrollTo({top:1e9,behavior:'smooth'});
$('#mn').onclick=e=>{const b=e.target.closest('button'),m=$('#mn');if(!b)return;m._it[b.dataset.i][2]();hm()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#mn'))hm()});

$('#pf').onclick=e=>{
  const p=P.find(x=>x.id===$('#pf').dataset.id);if(!p)return;
  const cp=e.target.closest('[data-copy]');if(cp){try{navigator.clipboard.writeText(cp.dataset.copy)}catch(x){}toast('Скопировано: '+cp.dataset.copy);return}
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='pc')return $('#pf').classList.remove('on');
  if(t.id==='pe'){
    const r=t.getBoundingClientRect();
    menu(r.left-170,r.bottom+6,[
      ['Поделиться','share',()=>{try{navigator.clipboard.writeText(`${p.n} (${fmtU(p.u)})`)}catch(x){}toast('Контакт скопирован')}],
      [p.pin?'Открепить чат':'Закрепить чат','pin',()=>{p.pin=p.pin?0:1;list();saveAll()}],
      ['Удалить чат','trash',()=>{p.hide=1;$('#pf').classList.remove('on');$('#chat').classList.remove('open');cur=null;list();saveAll()},1]
    ]);return;
  }
  const x=t.dataset.x;
  if(x==='msg'){$('#pf').classList.remove('on');open(p.id)}
  else if(x==='call'||x==='vid')call(p,x==='vid');
  else if(x==='mute'){p.mute=!p.mute;prof(p);list();saveAll()}
  else if(x==='gift'){if(cur!=p)open(p.id);$('#pf').classList.remove('on');shop()}
  else if(x==='blk'){p.blk=!p.blk;prof(p);saveAll();toast(p.blk?'Заблокирован':'Разблокирован')}
};

$('#call').onclick=e=>{
  const b=e.target.closest('.cbt');if(!b)return;
  if(b.id==='c-acc')return acceptIncomingCall();
  if(b.id==='c-rej'||b.id==='ce')return endCall(false);
  if(b.id==='cflip'){callFacing=callFacing==='user'?'environment':'user';if($('#cvid').classList.contains('on'))toggleCallVideo(true);toast('Камера перевёрнута');return}
  b.classList.toggle('on');
  if(b.id==='cmic'){
    const muted=b.classList.contains('on');
    if(callLocalStream)callLocalStream.getAudioTracks().forEach(t=>t.enabled=!muted);
    toast(muted?'Микрофон выкл.':'Микрофон вкл.');
  }
  if(b.id==='cvid')toggleCallVideo(b.classList.contains('on'));
};

$('#p3').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='logout-btn'){publishMyProfile(false);ls('lunarn_auth','');$('#auth').classList.add('on');return}if(b.dataset.s)sp(b.dataset.s)};
$('#sp').onclick=e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(t.id==='spb'){if(CK==='blk')sp('prv');else{$('#sp').classList.remove('on');mset()}return}
  if(t.id==='btn-upav'){const f=$('#fi');f.accept='image/*';f.onchange=()=>{const x=f.files[0];if(!x)return;compressImg(x,340,src=>{me.av=src;ls('lunarn_me',JSON.stringify(me));publishMyProfile(true);sp('pr',1);strs();toast('Аватар обновлён')});f.value=''};f.click();return}
  if(t.id==='btn-rmav'){me.av='';ls('lunarn_me',JSON.stringify(me));publishMyProfile(true);sp('pr',1);strs();return}
  if(d.delpk!=null){SK_PACKS.splice(+d.delpk,1);activePackIdx=0;saveAll();sp('pks',1);emp('s');return}
  if(t.classList.contains('sw')){ST[d.k]=ST[d.k]?0:1;t.classList.toggle('on');ap()}
  else if(d.v!=null){ST[t.parentNode.dataset.k]=d.v;[...t.parentNode.children].forEach(b=>b.classList.toggle('on',b==t));ap()}
  else if(d.st){const s=STY[d.st];ST.ac=s[1];ST.ac2=s[2];ST.wp=s[3];ST.bgc=s[4];ST.wimg='';ap();sp(CK,1)}
  else if(d.c){ST.ac=d.c;ap();sp(CK,1)}
  else if(d.bg!==undefined){ST.bgc=d.bg;ap();sp(CK,1)}
  else if(d.wp){ST.wp=d.wp;ST.wimg='';ap();sp(CK,1)}
  else if(t.id==='upwp'){const f=$('#fi');f.accept='image/*';f.onchange=()=>{const x=f.files[0];if(!x)return;compressImg(x,1080,src=>{ST.wimg=src;ap();sp(CK,1);toast('Обои установлены')});f.value=''};f.click()}
  else if(t.id==='rmwp'){ST.wimg='';ap();sp(CK,1)}
  else if(d.u){P.find(p=>p.id==d.u).blk=0;sp('blk',1);saveAll()}
  else if(d.top){moons+=+d.top;saveAll();toast('+'+d.top+' 🌙');sp('str',1)}
  else if(d.a==='chpin'){const np=prompt('Новый 4-значный код:',ST.pin);if(np&&/^\d{4}$/.test(np)){ST.pin=np;ap();toast('Код обновлён')}}
  else if(d.a==='exp'){const blob=new Blob([JSON.stringify({me,P,ST,SK_PACKS},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lunarn-backup.json';a.click();toast('Бэкап скачан')}
  else if(d.a==='cache'){ls('lunarn_chats','');P=[{id:'sv',n:'Избранное',u:'@saved',h:230,t:'s',role:'owner',s:'ваши заметки',m:[]}];list();sp(CK,1);toast('Кэш очищен')}
  else if(d.a==='blk')sp('blk')
  else if(d.a==='rst'){['theme','ac','ac2','bgc','wp','wimg','wpdim','fs','br','bl','anim','aur','comp','grad'].forEach(x=>ST[x]=DEF[x]);ap();sp(CK,1);toast('Сброшено')}
};
$('#sp').oninput=e=>{
  const i=e.target,v=i.value;
  if(i.dataset.p){me[i.dataset.p]=i.dataset.p==='h'?+v:v;ls('lunarn_me',JSON.stringify(me));if(i.type==='range'){i.parentNode.querySelector('b').textContent=v+'°';const b=$('#up-myav');if(b&&!me.av)b.style.background=`linear-gradient(135deg,hsl(${v} 82% 60%),hsl(${+v+50} 78% 48%))`}}
  else if(i.type==='range'){ST[i.dataset.k]=+v;i.parentNode.querySelector('b').textContent=v;ap()}
  else if(i.type==='color'){ST[i.dataset.k]=v;ap()}
};
$('#csi').oninput=e=>{const v=e.target.value.toLowerCase(),m=v&&[...cur.m].reverse().find(x=>pv(x).toLowerCase().includes(v));if(m)jump(m.id)};
$('#csx').onclick=()=>{$('#sq').style.display='none';$('#csi').value=''};

let stm=null,svIdx=0;
function strs(){
  const myKey=cleanU(me.u),myArr=getStoriesArr(myKey),hasMy=myArr.length>0;
  const others=Object.keys(STORIES).filter(k=>k!==myKey&&getStoriesArr(k).length>0);
  $('#sr').innerHTML=`<button data-sk="${myKey}" style="position:relative"><span class="rg${hasMy?'':' sn'}"><span>${av({n:me.n||'Я',h:me.h,av:me.av},52)}</span></span><span id="add-st-plus" style="position:absolute;right:4px;bottom:18px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:2px solid var(--bg)">+</span>Моя</button>`
    +others.map(k=>{const arr=getStoriesArr(k),u=USERS[k]||{n:'@'+k,h:240},allSeen=arr.every(x=>x._sn);return`<button data-sk="${k}"><span class="rg${allSeen?' sn':''}"><span>${av(u,52)}</span></span>${esc((u.n||k).split(' ')[0])}</button>`}).join('');
}

function pickNewStory(){
  const f=$('#fi');f.accept='image/*,video/*';
  f.onchange=()=>{
    const x=f.files[0];if(!x)return;
    if(x.type.startsWith('video/')){
      const url=URL.createObjectURL(x),tv=document.createElement('video');tv.preload='metadata';
      tv.onloadedmetadata=()=>{
        if(tv.duration>600){URL.revokeObjectURL(url);toast('Максимум 10 минут')}
        else saveStory({id:'st_'+Date.now(),type:'vid',src:url,dur:Math.max(4,tv.duration),likes:{},ts:Date.now()});
      };tv.src=url;
    }else compressImg(x,900,src=>saveStory({id:'st_'+Date.now(),type:'img',src,dur:6,likes:{},ts:Date.now()}));
    f.value='';
  };f.click();
}

function openStory(key,idx=0){
  clearTimeout(stm);const myKey=cleanU(me.u),arr=getStoriesArr(key);
  if(key===myKey&&!arr.length)return pickNewStory();
  if(!arr.length)return;
  if(idx<0)idx=0;
  if(idx>=arr.length){$('#sv').classList.remove('on');strs();return}
  svIdx=idx;
  const st=arr[idx];st._sn=1;
  const u=key===myKey?me:(USERS[key]||{n:'@'+key,u:'@'+key,h:240});
  const likes=st.likes||{},liked=!!likes[myKey],likeCnt=Object.keys(likes).length;
  const bars=arr.map((_,i)=>`<div class="sb${i<idx?' done':''}"><i${i===idx?` id="sv-bar" style="animation:sg ${st.dur||6}s linear forwards"`:''}></i></div>`).join('');
  const v=$('#sv');
  v.innerHTML=`
    <div class="sb-row">${bars}</div>
    <div class="sh2">${av(u,40)}<div><b>${esc(u.n)}</b><small style="display:block;font-size:11px;opacity:.7">${idx+1} из ${arr.length} · ${tm(st.ts||Date.now())}</small></div>${key===myKey?`<button class="ib" id="sv-add" title="Добавить ещё">${I('plus',20)}</button><button class="ib" id="sv-del">${I('trash',20)}</button>`:''}<button class="ib" id="sx">${I('x')}</button></div>
    <div class="sm" id="sv-stage" style="${st.type==='img'?`background:url(${st.src})`:''}">${st.type==='vid'?`<video src="${st.src}" autoplay playsinline></video>`:''}</div>
    <div class="sr2">
      ${key!==myKey?`<input id="sv-inp" placeholder="Ответить на историю…">`:'<span style="flex:1;font-size:13px;opacity:.75">Ваша публикация</span>'}
      <button id="sv-like" class="${liked?'liked':''}">❤️ <small style="font-size:13px">${likeCnt||''}</small></button>
    </div>`;
  v.classList.add('on');v.dataset.k=key;
  stm=setTimeout(()=>openStory(key,idx+1),(st.dur||6)*1000);
}

async function saveStory(obj){
  const k=cleanU(me.u);
  const arr=getStoriesArr(k);
  arr.push(obj);
  STORIES[k]=arr;saveAll();
  const cloudArr=arr.filter(x=>x.type==='img');
  if(sb&&navigator.onLine&&cloudArr.length){
    await sb.from('stories').upsert({username:k,data:cloudArr,updated_at:Date.now()},{onConflict:'username'});
  }
  strs();if(tabs===3)mset();openStory(k,arr.length-1);
}

$('#sr').onclick=e=>{
  if(e.target.closest('#add-st-plus')){pickNewStory();return}
  const b=e.target.closest('[data-sk]');if(b)openStory(b.dataset.sk,0);
};

$('#sv').onclick=async e=>{
  const t=e.target,v=$('#sv'),key=v.dataset.k,myKey=cleanU(me.u);
  if(t.closest('#sx')){clearTimeout(stm);v.classList.remove('on');strs();return}
  if(t.closest('#sv-add')){clearTimeout(stm);v.classList.remove('on');pickNewStory();return}
  if(t.closest('#sv-del')){
    clearTimeout(stm);
    const arr=getStoriesArr(myKey);arr.splice(svIdx,1);
    if(arr.length)STORIES[myKey]=arr;else delete STORIES[myKey];
    if(sb&&navigator.onLine){
      const cloudArr=arr.filter(x=>x.type==='img');
      if(cloudArr.length)await sb.from('stories').upsert({username:myKey,data:cloudArr,updated_at:Date.now()},{onConflict:'username'});
      else await sb.from('stories').delete().eq('username',myKey);
    }
    saveAll();strs();if(tabs===3)mset();
    if(arr.length)openStory(myKey,Math.min(svIdx,arr.length-1));else v.classList.remove('on');
    toast('История удалена');return;
  }
  if(t.closest('#sv-like')){
    const arr=getStoriesArr(key),st=arr[svIdx];if(!st)return;st.likes=st.likes||{};
    if(st.likes[myKey])delete st.likes[myKey];else{st.likes[myKey]=1;if(ST.vib)try{navigator.vibrate(18)}catch(err){}}
    STORIES[key]=arr;
    if(sb&&navigator.onLine){
      const cloudArr=arr.filter(x=>x.type==='img');
      if(cloudArr.length)await sb.from('stories').upsert({username:key,data:cloudArr,updated_at:Date.now()},{onConflict:'username'});
    }
    saveAll();openStory(key,svIdx);return;
  }
  if(t.closest('#sv-inp')){clearTimeout(stm);const b=$('#sv-bar');if(b)b.style.animationPlayState='paused';return}
  if(t.closest('#sv-stage')){
    const r=$('#sv-stage').getBoundingClientRect();
    if(e.clientX-r.left<r.width*0.35)openStory(key,svIdx-1);
    else openStory(key,svIdx+1);
  }
};

$('#sv').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='sv-inp'){
    const val=e.target.value.trim(),key=$('#sv').dataset.k;if(!val)return;
    const u=USERS[key];if(u)add({t:val,stRef:'История '+u.n},ensureUserChat(u));
    e.target.value='';clearTimeout(stm);$('#sv').classList.remove('on');toast('Ответ отправлен');
  }
});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

ap();ui();go(0);strs();checkAuth();initCloud();
</script>
